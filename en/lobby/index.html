,\"static/chunks/356-6c14030797882104.js\",\"185\",\"static/chunks/app/%5Blang%5D/%5Bslug%5D/page-3e835c085ebc0e97.js\"],\"default\"]\n4:[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L10\",null,{}]]}]}]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"div\",null,{\"className\":\"page page--room\",\"children\":[[\"$\",\"$L11\",null,{\"lang\":\"en\",\"ids\":[\"01\",\"02\",\"03\",\"04\",\"05\",\"06\",\"07\",\"08\",\"09\",\"10\",\"11\",\"12\",\"13\",\"14\"],\"tone\":\"night\"}],[\"$\",\"main\",null,{\"id\":\"main\",\"children\":[\"$\",\"$L12\",null,{\"lang\":\"en\",\"game\":{\"id\":\"00\",\"room\":{\"name\":{\"fr\":\"Le salon du hall\",\"en\":\"The lobby lounge\"},\"style\":{\"wall\":\"#4a2e2a\",\"wallDeep\":\"#3a231f\",\"floor\":\"#7a5838\",\"accent\":\"#24504a\",\"motif\":\"stripes\"}},\"skills\":[{\"fr\":\"Choisir la bonne fonction d’un assistant : relance, fichier, recherche web, projet, image ou artefact\",\"en\":\"Pick the right assistant feature: follow-up, file, web search, project, image or artifact\"},{\"fr\":\"Régler ses contrôles de données : refus de l’entraînement, chat temporaire ou incognito\",\"en\":\"Set your data controls: training opt-out, temporary or incognito chat\"},{\"fr\":\"Savoir ce que Copilot apporte dans Word, Excel, PowerPoint, Outlook et Teams\",\"en\":\"Know what Copilot brings to Word, Excel, PowerPoint, Outlook and Teams\"},{\"fr\":\"Choisir entre recherche web sourcée, documents personnels et outil de présentation, puis vérifier les sources\",\"en\":\"Choose between sourced web search, your own documents and a presentation tool, then check the sources\"},{\"fr\":\"Relire un contenu marketing ou une réponse client produits par l’IA avant de les envoyer\",\"en\":\"Review AI-made marketing content or a customer reply before sending it\"}],\"notions\":[{\"fr\":\"Utiliser ChatGPT : relances, fichiers, recherche web, images, projets, contrôles des données\",\"en\":\"Using ChatGPT: follow-ups, files, web search, images, projects, data controls\"},{\"fr\":\"Utiliser Claude : relances, fichiers, recherche web, artefacts, projets, contrôles des données\",\"en\":\"Using Claude: follow-ups, files, web search, artifacts, projects, data controls\"},{\"fr\":\"Microsoft 365 Copilot : réglages et personnalisation du chat, usages dans Word, Excel, PowerPoint, Outlook, Teams\",\"en\":\"Microsoft 365 Copilot: chat settings and personalisation, uses in Word, Excel, PowerPoint, Outlook, Teams\"},{\"fr\":\"Outils de recherche et de présentation : Perplexity, NotebookLM, Gamma, Canva, et vérification des sources\",\"en\":\"Research and presentation tools: Perplexity, NotebookLM, Gamma, Canva, and checking sources\"},{\"fr\":\"Créer du contenu marketing avec l’IA : voix de marque, réponses citables, données sourcées, relecture\",\"en\":\"Creating marketing content with AI: brand voice, citable answers, sourced data, review\"},{\"fr\":\"Réponses clients avec l’IA : fiche client, passage à un humain, cas sensibles\",\"en\":\"Customer replies with AI: customer file, handoff to a human, sensitive cases\"}],\"stations\":[{\"id\":\"chatgpt\",\"prop\":\"cH_desk\",\"at\":{\"x\":250,\"y\":560},\"object\":{\"fr\":\"Le comptoir du concierge\",\"en\":\"The concierge desk\"},\"title\":{\"fr\":\"ChatGPT : une fonction pour chaque besoin\",\"en\":\"ChatGPT: one feature for each need\"},\"show\":{\"fr\":\"Au comptoir, on ne pose pas qu’une question : on relance, on joint un fichier, on cherche sur le web, on range par projet. Chaque besoin a sa fonction.\",\"en\":\"At the desk you don’t just ask one question: you follow up, attach a file, search the web, file things by project. Each need has its feature.\"},\"mechanic\":{\"kind\":\"match\",\"prompt\":{\"fr\":\"Relie chaque fonction de ChatGPT à son usage.\",\"en\":\"Connect each ChatGPT feature to its use.\"},\"pairs\":[{\"id\":\"follow\",\"left\":{\"fr\":\"Question de relance\",\"en\":\"Follow-up question\"},\"right\":{\"fr\":\"Préciser ou corriger la réponse précédente sans tout réexpliquer\",\"en\":\"Refine or correct the previous answer without explaining everything again\"}},{\"id\":\"file\",\"left\":{\"fr\":\"Envoi de fichier\",\"en\":\"File upload\"},\"right\":{\"fr\":\"Faire résumer un PDF ou analyser un tableur\",\"en\":\"Have a PDF summarised or a spreadsheet analysed\"}},{\"id\":\"search\",\"left\":{\"fr\":\"Recherche web\",\"en\":\"Web search\"},\"right\":{\"fr\":\"Obtenir une information récente, avec des liens vers les sources\",\"en\":\"Get recent information, with links to the sources\"}},{\"id\":\"image\",\"left\":{\"fr\":\"Génération d’image\",\"en\":\"Image generation\"},\"right\":{\"fr\":\"Créer un visuel à partir d’une description\",\"en\":\"Create a visual from a description\"}},{\"id\":\"project\",\"left\":{\"fr\":\"Projet\",\"en\":\"Project\"},\"right\":{\"fr\":\"Regrouper les conversations, fichiers et consignes d’un même dossier\",\"en\":\"Group the conversations, files and instructions of one piece of work\"}},{\"id\":\"temp\",\"left\":{\"fr\":\"Chat temporaire\",\"en\":\"Temporary chat\"},\"right\":{\"fr\":\"Une conversation hors historique, non utilisée pour entraîner les modèles\",\"en\":\"A conversation kept out of your history and not used to train models\"}}]},\"takeaway\":{\"fr\":\"Une bonne relance vaut mieux qu’une nouvelle conversation : le contexte est déjà là. Pour une information récente, demande la recherche web et ouvre les liens.\",\"en\":\"A good follow-up beats a new conversation: the context is already there. For recent information, ask for web search and open the links.\"},\"more\":{\"fr\":\"Contrôles des données : dans les paramètres de ChatGPT, une option permet de refuser que tes conversations servent à améliorer les modèles. Le chat temporaire va plus loin pour une conversation ponctuelle : elle n’apparaît pas dans ton historique.\\nQuel que soit le réglage, ne colle pas de données personnelles de clients sans en avoir le droit.\",\"en\":\"Data controls: in ChatGPT’s settings, an option lets you refuse that your conversations be used to improve the models. Temporary chat goes further for a one-off conversation: it does not appear in your history.\\nWhatever the setting, don’t paste customers’ personal data unless you are allowed to.\"}},{\"id\":\"claude\",\"prop\":\"cH_pigeonholes\",\"at\":{\"x\":520,\"y\":470},\"object\":{\"fr\":\"Le casier aux projets\",\"en\":\"The project pigeonholes\"},\"title\":{\"fr\":\"Claude : projets, artefacts et vie privée\",\"en\":\"Claude: projects, artifacts and privacy\"},\"show\":{\"fr\":\"Tu prépares avec Claude la plaquette d’un client de Brume \u0026 Quai, dans un projet qui contient le brief et la charte. Tu relances, tu joins des fichiers, tu demandes une recherche web.\",\"en\":\"You are preparing a brochure for a Brume \u0026 Quai client with Claude, in a project that holds the brief and the style guide. You follow up, attach files, ask for a web search.\"},\"mechanic\":{\"kind\":\"choice\",\"multiple\":true,\"prompt\":{\"fr\":\"Coche les affirmations exactes.\",\"en\":\"Tick the accurate statements.\"},\"options\":[{\"id\":\"incognito\",\"label\":{\"fr\":\"Un chat incognito n’est pas utilisé pour améliorer Claude, même si le réglage d’amélioration est activé.\",\"en\":\"An incognito chat is not used to improve Claude, even when the model-improvement setting is on.\"},\"correct\":true,\"why\":{\"fr\":\"C’est ce qu’indique le centre de confidentialité d’Anthropic pour les comptes grand public.\",\"en\":\"That is what Anthropic’s Privacy Center states for consumer accounts.\"}},{\"id\":\"erase\",\"label\":{\"fr\":\"Désactiver le réglage d’entraînement retire tes données des modèles déjà entraînés.\",\"en\":\"Turning off the training setting removes your data from models already trained.\"},\"correct\":false,\"why\":{\"fr\":\"Non : les nouvelles conversations ne servent plus à l’entraînement, mais ce qui a déjà servi reste dans les modèles déjà entraînés. D’où l’intérêt de régler ce choix dès le début.\",\"en\":\"No: new conversations are no longer used for training, but what was already used stays in models already trained. Hence the point of setting this choice from the start.\"}},{\"id\":\"artifact\",\"label\":{\"fr\":\"Un artefact (document, présentation, petit outil) s’ouvre à côté de la conversation ; tu peux le modifier et y revenir.\",\"en\":\"An artifact (document, deck, small tool) opens beside the conversation; you can edit it and come back to it.\"},\"correct\":true,\"why\":{\"fr\":\"Exact : c’est la place idéale pour la plaquette, séparée des échanges.\",\"en\":\"Right: it is the ideal place for the brochure, separate from the exchanges.\"}},{\"id\":\"nosource\",\"label\":{\"fr\":\"Avec la recherche web, Claude répond sans citer ses sources : impossible de vérifier.\",\"en\":\"With web search, Claude answers without citing its sources: no way to check.\"},\"correct\":false,\"why\":{\"fr\":\"Faux : les réponses issues de la recherche web comportent des citations. Ouvre-les pour vérifier ce qu’elles disent vraiment.\",\"en\":\"False: answers based on web search include citations. Open them to check what they really say.\"}}]},\"takeaway\":{\"fr\":\"Un projet garde ses propres conversations et sa base de documents ; l’artefact porte le livrable. Le réglage d’entraînement vaut pour l’avenir, pas pour le passé.\",\"en\":\"A project keeps its own conversations and document base; the artifact carries the deliverable. The training setting applies to the future, not the past.\"},\"more\":{\"fr\":\"Le réglage se trouve dans Paramètres, rubrique Confidentialité. Les signalements de sécurité suivent des règles à part, décrites dans le centre de confidentialité.\\nComme avec ChatGPT : une relance dans la même conversation garde le contexte ; un nouveau sujet mérite une nouvelle conversation.\",\"en\":\"The setting is under Settings, Privacy. Safety flags follow separate rules, described in the Privacy Center.\\nAs with ChatGPT: a follow-up in the same conversation keeps the context; a new topic deserves a new conversation.\"}},{\"id\":\"copilot\",\"prop\":\"cH_secretary\",\"at\":{\"x\":800,\"y\":690},\"object\":{\"fr\":\"Le secrétaire aux cinq tiroirs\",\"en\":\"The five-drawer secretary\"},\"title\":{\"fr\":\"Copilot : chaque appli a ses gestes\",\"en\":\"Copilot: each app has its own moves\"},\"show\":{\"fr\":\"Copilot ne fait pas la même chose dans chaque application Microsoft 365. Et son chat a ses propres réglages de personnalisation.\",\"en\":\"Copilot does not do the same thing in every Microsoft 365 app. And its chat has its own personalisation settings.\"},\"mechanic\":{\"kind\":\"sort\",\"prompt\":{\"fr\":\"Range chaque tâche là où Copilot la fait.\",\"en\":\"Sort each task where Copilot does it.\"},\"bins\":[{\"id\":\"word\",\"label\":{\"fr\":\"Word\",\"en\":\"Word\"}},{\"id\":\"excel\",\"label\":{\"fr\":\"Excel\",\"en\":\"Excel\"}},{\"id\":\"ppt\",\"label\":{\"fr\":\"PowerPoint\",\"en\":\"PowerPoint\"}},{\"id\":\"outlook\",\"label\":{\"fr\":\"Outlook\",\"en\":\"Outlook\"}},{\"id\":\"teams\",\"label\":{\"fr\":\"Teams\",\"en\":\"Teams\"}},{\"id\":\"chat\",\"label\":{\"fr\":\"Réglages de Copilot Chat\",\"en\":\"Copilot Chat settings\"}}],\"items\":[{\"id\":\"summ\",\"label\":{\"fr\":\"Résumer un long document et lui poser des questions\",\"en\":\"Summarise a long document and ask it questions\"},\"bin\":\"word\",\"why\":{\"fr\":\"Word : rédiger, réécrire, et comprendre un document long.\",\"en\":\"Word: draft, rewrite, and understand a long document.\"}},{\"id\":\"rewrite\",\"label\":{\"fr\":\"Réécrire un paragraphe sur un ton plus concis\",\"en\":\"Rewrite a paragraph in a more concise tone\"},\"bin\":\"word\",\"why\":{\"fr\":\"Réécrire une sélection ou ajuster le ton fait partie des usages décrits pour Word.\",\"en\":\"Rewriting a selection or adjusting the tone is among the uses described for Word.\"}},{\"id\":\"pivot\",\"label\":{\"fr\":\"Créer un graphique ou un tableau croisé dynamique à partir des données\",\"en\":\"Create a chart or a PivotTable from the data\"},\"bin\":\"excel\",\"why\":{\"fr\":\"Excel : Copilot passe par les outils du classeur (tableaux, graphiques, formules), et le résultat reste modifiable.\",\"en\":\"Excel: Copilot works through the workbook’s tools (tables, charts, formulas), and the result stays editable.\"}},{\"id\":\"deck\",\"label\":{\"fr\":\"Créer une présentation à partir d’une consigne ou d’un fichier\",\"en\":\"Create a presentation from a prompt or a file\"},\"bin\":\"ppt\",\"why\":{\"fr\":\"PowerPoint : Copilot construit un diaporama, et peut poser des questions sur le public ou la longueur.\",\"en\":\"PowerPoint: Copilot builds a deck, and may ask about the audience or length.\"}},{\"id\":\"thread\",\"label\":{\"fr\":\"Résumer un long fil d’e-mails, avec des renvois aux messages\",\"en\":\"Summarise a long email thread, with references to the messages\"},\"bin\":\"outlook\",\"why\":{\"fr\":\"Outlook : le résumé peut comporter des citations numérotées qui mènent à l’e-mail concerné.\",\"en\":\"Outlook: the summary may include numbered citations that lead to the relevant email.\"}},{\"id\":\"meeting\",\"label\":{\"fr\":\"Récapituler une réunion : points clés et actions à suivre\",\"en\":\"Recap a meeting: key points and action items\"},\"bin\":\"teams\",\"why\":{\"fr\":\"Teams : pour interroger Copilot sur la réunion après coup, la transcription doit avoir été activée pendant la réunion.\",\"en\":\"Teams: to ask Copilot about the meeting afterwards, transcription must have been on during the meeting.\"}},{\"id\":\"instr\",\"label\":{\"fr\":\"Ajouter des instructions personnalisées pour toutes tes conversations\",\"en\":\"Add custom instructions for all your conversations\"},\"bin\":\"chat\",\"why\":{\"fr\":\"La personnalisation du chat : instructions personnalisées et mémoire, que tu peux consulter et faire oublier.\",\"en\":\"Chat personalisation: custom instructions and memory, which you can review and have forgotten.\"}},{\"id\":\"tempc\",\"label\":{\"fr\":\"Ouvrir un chat temporaire, que Copilot ne retiendra pas\",\"en\":\"Open a temporary chat that Copilot will not remember\"},\"bin\":\"chat\",\"why\":{\"fr\":\"Ce qui est dit dans un chat temporaire n’est pas retenu pour personnaliser la suite.\",\"en\":\"What is said in a temporary chat is not kept to personalise later answers.\"}}]},\"takeaway\":{\"fr\":\"Même nom, gestes différents : Copilot s’adapte à chaque appli. Si une fonction n’apparaît pas, elle dépend peut-être de ta licence ou des réglages de ton organisation.\",\"en\":\"Same name, different moves: Copilot adapts to each app. If a feature doesn’t show, it may depend on your licence or your organisation’s settings.\"},\"more\":{\"fr\":\"Pour savoir ce que Copilot Chat retient de toi, demande-lui « Que sais-tu de moi ? ». Tu peux lui demander d’oublier un détail, gérer sa mémoire dans les paramètres, ou passer en chat temporaire.\",\"en\":\"To find out what Copilot Chat remembers about you, ask it “What do you know about me?”. You can ask it to forget a detail, manage its memory in the settings, or switch to a temporary chat.\"}},{\"id\":\"research\",\"prop\":\"cH_lectern\",\"at\":{\"x\":1075,\"y\":560},\"object\":{\"fr\":\"Le lutrin des sources\",\"en\":\"The source lectern\"},\"title\":{\"fr\":\"Interroger ses propres documents\",\"en\":\"Ask your own documents\"},\"show\":{\"fr\":\"Perplexity cherche sur le web et cite ses sources ; NotebookLM répond à partir des documents que tu lui donnes ; Gamma et Canva mettent tes notes en présentation. Ici, joue un carnet de type NotebookLM.\",\"en\":\"Perplexity searches the web and cites its sources; NotebookLM answers from the documents you give it; Gamma and Canva turn your notes into a presentation. Here, play a NotebookLM-style notebook.\"},\"mechanic\":{\"kind\":\"loop\",\"prompt\":{\"fr\":\"Fais chaque action dans l’ordre utile, puis réponds en t’appuyant sur la citation vérifiée.\",\"en\":\"Take each action in a useful order, then answer from the checked citation.\"},\"goal\":{\"fr\":\"D’après les documents de l’hôtel : jusqu’à quand un groupe peut-il annuler gratuitement ?\",\"en\":\"According to the hotel’s documents: until when can a group cancel free of charge?\"},\"tools\":[{\"id\":\"add\",\"label\":\"ajouter_sources(3 documents)\",\"returns\":{\"fr\":\"Trois sources dans le carnet : conditions générales, conditions groupes, carte du salon.\",\"en\":\"Three sources in the notebook: general terms, group terms, lounge menu.\"}},{\"id\":\"web\",\"label\":\"recherche_web(annulation hôtel)\",\"returns\":{\"fr\":\"Des pages d’autres hôtels, avec d’autres règles.\",\"en\":\"Pages from other hotels, with other rules.\"}},{\"id\":\"pick\",\"label\":\"cocher_source(conditions groupes)\",\"returns\":{\"fr\":\"Seule la source « conditions groupes » servira à répondre.\",\"en\":\"Only the “group terms” source will be used to answer.\"}},{\"id\":\"ask\",\"label\":\"demander(annulation groupe ?)\",\"returns\":{\"fr\":\"« Annulation gratuite jusqu’à 30 jours avant l’arrivée [1]. »\",\"en\":\"“Free cancellation up to 30 days before arrival [1].”\"}},{\"id\":\"cite\",\"label\":\"ouvrir_citation([1])\",\"returns\":{\"fr\":\"Passage cité, dans son contexte : « Pour les groupes de dix chambres et plus, l’annulation est gratuite jusqu’à 30 jours avant l’arrivée. »\",\"en\":\"Quoted passage, in context: “For groups of ten rooms or more, cancellation is free up to 30 days before arrival.”\"}}],\"expected\":[\"add\",\"pick\",\"ask\",\"cite\"],\"wrongTool\":{\"fr\":\"Pas maintenant. Ajoute d’abord tes sources, choisis celles qui servent, demande, puis ouvre la citation. La recherche web ne parle pas de tes documents.\",\"en\":\"Not now. First add your sources, pick the ones that matter, ask, then open the citation. Web search does not speak about your documents.\"},\"tooEarly\":{\"fr\":\"Trop tôt : tu répondrais sans avoir lu le passage cité. La citation, c’est ce qui permet de vérifier.\",\"en\":\"Too early: you would answer without reading the quoted passage. The citation is what lets you check.\"},\"finalLabel\":{\"fr\":\"FINAL : « 30 jours avant l’arrivée, pour dix chambres et plus »\",\"en\":\"FINAL: “30 days before arrival, for ten rooms or more”\"}},\"takeaway\":{\"fr\":\"Un carnet comme NotebookLM répond depuis tes sources, avec des citations à ouvrir. Ouvrir la citation a ajouté une condition : dix chambres et plus.\",\"en\":\"A notebook like NotebookLM answers from your sources, with citations to open. Opening the citation added a condition: ten rooms or more.\"},\"more\":{\"fr\":\"Les documents de l’hôtel sont un exemple fictif. Google présente aujourd’hui NotebookLM sous le nom Gemini Notebook ; son aide indique que le chat s’appuie sur tes sources et que chaque citation mène au passage cité.\\nPerplexity : une question sur le web, une réponse avec des sources numérotées, à ouvrir avant de reprendre un chiffre.\\nGamma et Canva : colle tes notes, obtiens une présentation, puis relis chaque diapositive comme un texte.\",\"en\":\"The hotel documents are a fictional example. Google now presents NotebookLM under the name Gemini Notebook; its help says chat relies on your sources and each citation leads to the quoted passage.\\nPerplexity: a question on the web, an answer with numbered sources, to open before reusing a figure.\\nGamma and Canva: paste your notes, get a presentation, then reread each slide like a text.\"}},{\"id\":\"marketing\",\"prop\":\"cH_poster\",\"at\":{\"x\":1290,\"y\":470},\"object\":{\"fr\":\"L’affiche à relire\",\"en\":\"The poster to review\"},\"title\":{\"fr\":\"Un contenu marketing se relit\",\"en\":\"Marketing content gets reviewed\"},\"show\":{\"fr\":\"L’IA a écrit l’annonce du salon d’un hôtel client de Brume \u0026 Quai. Le dossier de faits contient les horaires, la presse, le thé et les réservations ; la voix de marque : vouvoiement, sobre, sans superlatif.\",\"en\":\"The AI wrote the lounge announcement for a hotel client of Brume \u0026 Quai. The fact file holds the opening hours, the press, the tea and the bookings; the brand voice: formal “vous”, understated, no superlatives.\"},\"mechanic\":{\"kind\":\"spot\",\"prompt\":{\"fr\":\"Clique les lignes qui ne passent pas la relecture.\",\"en\":\"Click the lines that fail the review.\"},\"lines\":[{\"text\":{\"fr\":\"Le salon du hall vous accueille de 7 h à 23 h, au rez-de-chaussée.\",\"en\":\"The lobby lounge welcomes you from 7 am to 11 pm, on the ground floor.\"},\"faulty\":false},{\"text\":{\"fr\":\"93 % des voyageurs préfèrent les hôtels indépendants.\",\"en\":\"93% of travellers prefer independent hotels.\"},\"faulty\":true,\"why\":{\"fr\":\"Ce chiffre n’est pas dans le dossier de faits et n’a pas de source : supprime-le ou trouve une source vérifiable et cite-la.\",\"en\":\"This figure is not in the fact file and has no source: remove it or find a verifiable source and cite it.\"}},{\"text\":{\"fr\":\"Le MEILLEUR salon de toute la ville, tout simplement !!!\",\"en\":\"The BEST lounge in the whole city, period!!!\"},\"faulty\":true,\"why\":{\"fr\":\"Superlatif, majuscules, points d’exclamation : la voix de marque est cassée, et l’affirmation est invérifiable.\",\"en\":\"Superlative, capitals, exclamation marks: the brand voice is broken, and the claim cannot be checked.\"}},{\"text\":{\"fr\":\"Vous y trouverez la presse du jour et un thé servi jusqu’à 18 h.\",\"en\":\"You will find the day’s papers there and tea served until 6 pm.\"},\"faulty\":false},{\"text\":{\"fr\":\"Groupes : réservation à la réception ou par e-mail.\",\"en\":\"Groups: book at reception or by email.\"},\"faulty\":false}]},\"takeaway\":{\"fr\":\"Avant de publier : chaque chiffre a une source, chaque phrase respecte la voix de marque, chaque promesse est tenable. Une phrase claire et factuelle est aussi plus facile à citer.\",\"en\":\"Before publishing: every figure has a source, every sentence fits the brand voice, every promise can be kept. A clear, factual sentence is also easier to quote.\"},\"more\":{\"fr\":\"Réponse citable : une phrase qui répond seule à une question de client (qui, quoi, où, quand), sans jargon, qu’un moteur de réponse ou un journaliste peut reprendre telle quelle.\\nDonne à l’IA le guide de voix et le dossier de faits, et demande-lui d’écrire [À SOURCER] plutôt que d’inventer un chiffre.\",\"en\":\"Citable answer: a sentence that answers a customer question on its own (who, what, where, when), with no jargon, that an answer engine or a journalist can reuse as is.\\nGive the AI the voice guide and the fact file, and ask it to write [TO SOURCE] rather than invent a figure.\"}}],\"challenge\":{\"title\":{\"fr\":\"La tournée du concierge\",\"en\":\"The concierge’s round\"},\"brief\":{\"fr\":\"Trois demandes de la journée : choisir l’outil, publier proprement, et répondre à un client sans risque.\",\"en\":\"Three requests of the day: pick the tool, publish properly, and answer a customer safely.\"},\"steps\":[{\"kind\":\"sort\",\"prompt\":{\"fr\":\"Quel outil pour quelle demande ?\",\"en\":\"Which tool for which request?\"},\"bins\":[{\"id\":\"pplx\",\"label\":{\"fr\":\"Perplexity : le web, sources citées\",\"en\":\"Perplexity: the web, sources cited\"}},{\"id\":\"nb\",\"label\":{\"fr\":\"NotebookLM : tes propres documents\",\"en\":\"NotebookLM: your own documents\"}},{\"id\":\"deck\",\"label\":{\"fr\":\"Gamma ou Canva : une présentation\",\"en\":\"Gamma or Canva: a presentation\"}},{\"id\":\"priv\",\"label\":{\"fr\":\"Chat temporaire ou incognito\",\"en\":\"Temporary or incognito chat\"}}],\"items\":[{\"id\":\"events\",\"label\":{\"fr\":\"Quels événements ont lieu en ville ce week-end, avec les liens ?\",\"en\":\"What events are on in town this weekend, with the links?\"},\"bin\":\"pplx\",\"why\":{\"fr\":\"Information récente, sur le web : une réponse avec sources à ouvrir.\",\"en\":\"Recent information, on the web: an answer with sources to open.\"}},{\"id\":\"market\",\"label\":{\"fr\":\"Trouver d’où vient un chiffre de marché lu dans un article\",\"en\":\"Find where a market figure read in an article comes from\"},\"bin\":\"pplx\",\"why\":{\"fr\":\"Remonter à la source publique d’un chiffre : recherche web sourcée, puis lecture de la source elle-même.\",\"en\":\"Tracing a figure back to its public source: sourced web search, then reading the source itself.\"}},{\"id\":\"contracts\",\"label\":{\"fr\":\"Comparer les règles d’annulation de nos trois contrats fournisseurs, passage exact à l’appui\",\"en\":\"Compare the cancellation rules of our three supplier contracts, with the exact passage\"},\"bin\":\"nb\",\"why\":{\"fr\":\"La réponse est dans tes documents : un carnet de sources la cite passage par passage.\",\"en\":\"The answer is in your documents: a source notebook quotes it passage by passage.\"}},{\"id\":\"study\",\"label\":{\"fr\":\"Faire une fiche de révision à partir des PDF de la formation\",\"en\":\"Make a study sheet from the course PDFs\"},\"bin\":\"nb\",\"why\":{\"fr\":\"Transformer ses propres sources en guide ou en fiche fait partie des usages de NotebookLM.\",\"en\":\"Turning your own sources into a guide or a sheet is one of NotebookLM’s uses.\"}},{\"id\":\"slides\",\"label\":{\"fr\":\"Faire des douze points de ma réunion un support de huit diapositives\",\"en\":\"Turn the twelve points of my meeting into an eight-slide deck\"},\"bin\":\"deck\",\"why\":{\"fr\":\"Des notes à mettre en forme : c’est le métier de Gamma ou de Canva. Relis ensuite chaque diapositive.\",\"en\":\"Notes to lay out: that is Gamma’s or Canva’s job. Then reread every slide.\"}},{\"id\":\"idea\",\"label\":{\"fr\":\"Tester une idée sans que l’échange serve à entraîner les modèles\",\"en\":\"Try out an idea without the exchange being used to train models\"},\"bin\":\"priv\",\"why\":{\"fr\":\"Le chat temporaire de ChatGPT et le chat incognito de Claude ne servent pas à l’entraînement.\",\"en\":\"ChatGPT’s temporary chat and Claude’s incognito chat are not used for training.\"}}]},{\"kind\":\"order\",\"prompt\":{\"fr\":\"Remets dans l’ordre la publication d’une page « Le salon » sur le site de l’hôtel.\",\"en\":\"Put in order the publication of a “The lounge” page on the hotel’s website.\"},\"items\":[{\"id\":\"gather\",\"label\":{\"fr\":\"Réunir le guide de voix et un dossier de faits, chaque chiffre avec sa source\",\"en\":\"Gather the voice guide and a fact file, each figure with its source\"}},{\"id\":\"draft\",\"label\":{\"fr\":\"Demander à l’IA un brouillon de réponses courtes et citables, à partir de ces deux documents\",\"en\":\"Ask the AI for a draft of short, citable answers, based on those two documents\"},\"hint\":{\"fr\":\"L’IA a besoin des faits et de la voix avant d’écrire, sinon elle invente.\",\"en\":\"The AI needs the facts and the voice before writing, or it invents.\"}},{\"id\":\"check\",\"label\":{\"fr\":\"Contrôler le brouillon : sources, voix de marque, promesses tenables\",\"en\":\"Check the draft: sources, brand voice, promises that can be kept\"},\"hint\":{\"fr\":\"On contrôle ce qui existe : le brouillon d’abord.\",\"en\":\"You check what exists: the draft first.\"}},{\"id\":\"approve\",\"label\":{\"fr\":\"Faire valider par la personne responsable\",\"en\":\"Get approval from the person in charge\"},\"hint\":{\"fr\":\"La validation porte sur la version corrigée.\",\"en\":\"Approval applies to the corrected version.\"}},{\"id\":\"publish\",\"label\":{\"fr\":\"Publier\",\"en\":\"Publish\"}}]},{\"kind\":\"spot\",\"prompt\":{\"fr\":\"Journal d’une réponse client assistée par IA. Clique les étapes fautives.\",\"en\":\"Log of an AI-assisted customer .com/en/articles/9517075-what-are-projects\",\"kind\":\"doc\",\"source\":\"Anthropic\",\"lang\":\"en\",\"note\":{\"fr\":\"Ce qu’un projet Claude regroupe : conversations, documents, consignes.\",\"en\":\"What a Claude project groups: conversations, documents, instructions.\"},\"programme\":false},{\"title\":\"What are artifacts and how do I use them?\",\"url\":\"https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them\",\"kind\":\"doc\",\"source\":\"Anthropic\",\"lang\":\"en\",\"note\":{\"fr\":\"Les contenus que Claude crée à côté de la conversation.\",\"en\":\"The content Claude creates beside the conversation.\"},\"programme\":false},{\"title\":\"Enable and use web search\",\"url\":\"https://support.claude.com/en/articles/10684626-enable-and-use-web-search\",\"kind\":\"doc\",\"source\":\"Anthropic\",\"lang\":\"en\",\"note\":{\"fr\":\"Comment activer la recherche web et lire ses citations.\",\"en\":\"How to turn on web search and read its citations.\"},\"programme\":false},{\"title\":\"How do I change my model improvement privacy settings?\",\"url\":\"https://privacy.claude.com/en/articles/12109829-how-do-i-change-my-model-improvement-privacy-settings\",\"kind\":\"doc\",\"source\":\"Anthropic\",\"lang\":\"en\",\"note\":{\"fr\":\"Où régler l’usage de tes conversations pour l’entraînement, et ce que ce réglage change.\",\"en\":\"Where to set the use of your conversations for training, and what the setting changes.\"},\"programme\":false},{\"title\":\"Is my data used for model training?\",\"url\":\"https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training\",\"kind\":\"doc\",\"source\":\"Anthropic\",\"lang\":\"en\",\"note\":{\"fr\":\"Les cas d’usage pour l’entraînement, et la règle des chats incognito.\",\"en\":\"When data is used for training, and the rule for incognito chats.\"},\"programme\":false},{\"title\":\"Personalize what Microsoft Copilot remembers\",\"url\":\"https://support.microsoft.com/en-us/microso
