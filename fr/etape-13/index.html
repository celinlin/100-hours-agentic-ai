pt>self.__next_f.push([1,"10:I[4253,[\"160\",\"static/chunks/app/%5Blang%5D/layout-9b21cd8cfef4e24e.js\"],\"default\"]\n11:I[6745,[\"176\",\"static/chunks/176-dbfe7d379a5d476e.js\",\"745\",\"static/chunks/745-9aad99b84d9fd920.js\",\"772\",\"static/chunks/772-881fb2d50677c719.js\",\"185\",\"static/chunks/app/%5Blang%5D/%5Bslug%5D/page-e6793636e031a6b1.js\"],\"default\"]\n12:I[2419,[\"176\",\"static/chunks/176-dbfe7d379a5d476e.js\",\"745\",\"static/chunks/745-9aad99b84d9fd920.js\",\"772\",\"static/chunks/772-881fb2d50677c719.js\",\"185\",\"static/chunks/app/%5Blang%5D/%5Bslug%5D/page-e6793636e031a6b1.js\"],\"default\"]\n4:[\"$\",\"html\",null,{\"lang\":\"fr\",\"children\":[\"$\",\"body\",null,{\"children\":[[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L10\",null,{}]]}]}]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"div\",null,{\"className\":\"page page--room\",\"children\":[[\"$\",\"$L11\",null,{\"lang\":\"fr\",\"ids\":[\"01\",\"02\",\"03\",\"04\",\"05\",\"06\",\"07\",\"08\",\"09\",\"10\",\"11\",\"12\",\"13\",\"14\"],\"tone\":\"night\"}],[\"$\",\"main\",null,{\"id\":\"main\",\"children\":[\"$\",\"$L12\",null,{\"lang\":\"fr\",\"game\":{\"id\":\"13\",\"room\":{\"name\":{\"fr\":\"La chaufferie\",\"en\":\"The boiler room\"},\"style\":{\"wall\":\"#3e3326\",\"wallDeep\":\"#31281e\",\"floor\":\"#6a4a2c\",\"accent\":\"#94672a\",\"motif\":\"grid\"}},\"skills\":[{\"fr\":\"Faire passer chaque demande par la boucle de service : budget, essais, abandon propre, alerte\",\"en\":\"Run every request through the service loop: budget, retries, clean give-up, alert\"},{\"fr\":\"Garder la clé d’API dans l’environnement, jamais dans le code ni le dépôt\",\"en\":\"Keep the API key in the environment, never in the code or the repository\"},{\"fr\":\"Réagir à un 429, un 529, un 500 ou un 401 sans aggraver la panne\",\"en\":\"React to a 429, 529, 500 or 401 without making the outage worse\"},{\"fr\":\"Publier une mise à jour après les 35 tests, et revenir en arrière en une commande\",\"en\":\"Ship an update after the 35 tests, and roll back in one command\"},{\"fr\":\"Choisir l’outil selon le besoin et planifier un premier projet avec responsable, date et critère d’arrêt\",\"en\":\"Pick the tool for the need and plan a first project with an owner, a date and a stop criterion\"}],\"notions\":[{\"fr\":\"Automatiser les tâches répétitives\",\"en\":\"Automating repetitive tasks\"},{\"fr\":\"Planifier ses premiers projets IA (feuille de route, responsables, dates, critères d’arrêt)\",\"en\":\"Planning your first AI projects (roadmap, owners, dates, stop criteria)\"},{\"fr\":\"Choisir l’outil selon le besoin : générer, automatiser, RPA\",\"en\":\"Choosing the tool for the need: generate, automate, RPA\"}],\"stations\":[{\"id\":\"loop\",\"prop\":\"c13_boiler\",\"at\":{\"x\":800,\"y\":690},\"object\":{\"fr\":\"La chaudière\",\"en\":\"The boiler\"},\"title\":{\"fr\":\"La boucle de service\",\"en\":\"The service loop\"},\"show\":{\"fr\":\"En service, personne ne regarde. Chaque demande passe les mêmes contrôles, pour qu’une panne sorte par une porte connue.\",\"en\":\"In service, nobody is watching. Every request goes through the same checks, so that a failure leaves through a known door.\"},\"mechanic\":{\"kind\":\"order\",\"prompt\":{\"fr\":\"Remets dans l’ordre le trajet d’une demande.\",\"en\":\"Put a request’s journey in order.\"},\"items\":[{\"id\":\"in\",\"label\":{\"fr\":\"La demande arrive, avec un identifiant\",\"en\":\"The request arrives, with an identifier\"}},{\"id\":\"budget\",\"label\":{\"fr\":\"Le budget du jour est vérifié avant l’appel\",\"en\":\"The daily budget is checked before the call\"},\"hint\":{\"fr\":\"Vérifié après l’appel, le plafond arrive trop tard.\",\"en\":\"Checked after the call, the cap comes too late.\"}},{\"id\":\"work\",\"label\":{\"fr\":\"L’agent travaille, ses traces s’écrivent\",\"en\":\"The agent works, its traces are written\"}},{\"id\":\"retry\",\"label\":{\"fr\":\"En cas d’erreur : nouvel essai, puis abandon propre\",\"en\":\"On error: a new attempt, then a clean give-up\"},\"hint\":{\"fr\":\"On ne réessaie qu’après une erreur survenue pendant le travail.\",\"en\":\"You only retry after an error during the work.\"}},{\"id\":\"alert\",\"label\":{\"fr\":\"Une alerte part si un seuil est franchi\",\"en\":\"An alert goes out if a threshold is crossed\"}}]},\"takeaway\":{\"fr\":\"Ce qui marche chez toi doit marcher sans toi. Un abandon propre, avec alerte et trace, vaut mieux qu’une réponse inventée.\",\"en\":\"What works on your machine must work without you. A clean give-up, with an alert and a trace, beats an invented answer.\"},\"more\":{\"fr\":\"Une alerte utile est rare et précise : elle dit quoi, quand, et quoi faire. Si tu en reçois dix par jour, tu n’en liras plus aucune.\\nNote chaque jour dans le relevé du service : demandes, échecs, dépense. Exemple du programme : lundi, 1 échec sur 40, 4,10 €.\",\"en\":\"A useful alert is rare and precise: it says what, when, and what to do. If you get ten a day, you will stop reading them.\\nEvery day, note in the service log: requests, failures, spend. The programme’s example: Monday, 1 failure out of 40, €4.10.\"}},{\"id\":\"code\",\"prop\":\"c13_valves\",\"at\":{\"x\":520,\"y\":470},\"object\":{\"fr\":\"Le tableau des vannes\",\"en\":\"The valve board\"},\"title\":{\"fr\":\"La clé dehors, les essais bornés\",\"en\":\"Key outside, retries bounded\"},\"show\":{\"fr\":\"Voici le service du code de référence. La clé vit dans une variable d’environnement, le plafond passe avant l’appel, et les essais sont comptés.\",\"en\":\"Here is the service from the reference code. The key lives in an environment variable, the cap comes before the call, and attempts are counted.\"},\"mechanic\":{\"kind\":\"fill\",\"prompt\":{\"fr\":\"Règle chaque vanne du code.\",\"en\":\"Set each valve of the code.\"},\"code\":true,\"template\":{\"fr\":\"CLE = {{0}}\\nif not CLE:\\n    raise SystemExit(\\\"Clé absente : définis ANTHROPIC_API_KEY.\\\")\\nclient = anthropic.Anthropic(api_key=CLE, max_retries={{1}})\\n\\ndef appeler(depense: float, budget: float, **demande):\\n    if depense {{2}} budget:\\n        alerter(\\\"Budget du jour atteint\\\")  # avant l'appel\\n        return None\\n    for essai in range(3):\\n        try:\\n            return client.messages.create(**demande)\\n        except (anthropic.RateLimitError,\\n                anthropic.InternalServerError) as e:\\n            ecrire(evenement=\\\"erreur\\\", nom=\\\"api\\\", detail=str(e)[:200])\\n            time.sleep({{3}})  # 1 s, 2 s, 4 s\\n    alerter(\\\"API indisponible après trois essais\\\")\\n    return {{4}}  # abandon propre\",\"en\":\"CLE = {{0}}\\nif not CLE:\\n    raise SystemExit(\\\"Clé absente : définis ANTHROPIC_API_KEY.\\\")\\nclient = anthropic.Anthropic(api_key=CLE, max_retries={{1}})\\n\\ndef appeler(depense: float, budget: float, **demande):\\n    if depense {{2}} budget:\\n        alerter(\\\"Budget du jour atteint\\\")  # avant l'appel\\n        return None\\n    for essai in range(3):\\n        try:\\n            return client.messages.create(**demande)\\n        except (anthropic.RateLimitError,\\n                anthropic.InternalServerError) as e:\\n            ecrire(evenement=\\\"erreur\\\", nom=\\\"api\\\", detail=str(e)[:200])\\n            time.sleep({{3}})  # 1 s, 2 s, 4 s\\n    alerter(\\\"API indisponible après trois essais\\\")\\n    return {{4}}  # abandon propre\"},\"blanks\":[{\"options\":[\"os.environ.get(\\\"ANTHROPIC_API_KEY\\\")\",\"\\\"sk-ant-api03-…\\\"\",\"config[\\\"cle\\\"]\"],\"answer\":\"os.environ.get(\\\"ANTHROPIC_API_KEY\\\")\",\"why\":{\"fr\":\"La clé est lue dans l’environnement : ni dans le code, ni dans le fichier de configuration, donc jamais dans le dépôt.\",\"en\":\"The key is read from the environment: not in the code, not in the config file, so never in the repository.\"}},{\"options\":[\"0\",\"2\",\"10\"],\"answer\":\"0\",\"why\":{\"fr\":\"Le SDK réessaie déjà tout seul (2 fois par défaut). À 0, ta boucle est la seule à compter les essais : pas de 3 × 3 appels cachés.\",\"en\":\"The SDK already retries on its own (twice by default). At 0, your loop is the only one counting attempts: no hidden 3 × 3 calls.\"}},{\"options\":[\"\u003e=\",\"\u003c\",\"==\"],\"answer\":\"\u003e=\",\"why\":{\"fr\":\"Dès que la dépense atteint le budget, on refuse avant d’appeler : une boucle folle coûte au plus le budget du jour.\",\"en\":\"As soon as spend reaches the budget, refuse before calling: a runaway loop costs at most the daily budget.\"}},{\"options\":[\"2 ** essai\",\"0\",\"essai\"],\"answer\":\"2 ** essai\",\"why\":{\"fr\":\"1 s, 2 s, 4 s : le délai double à chaque essai, pour ne pas aggraver la saturation.\",\"en\":\"1 s, 2 s, 4 s: the delay doubles at each attempt, so as not to worsen the overload.\"}},{\"options\":[\"None\",\"\\\"Rendez-vous confirmé.\\\"\",\"appeler(depense, budget, **demande)\"],\"answer\":\"None\",\"why\":{\"fr\":\"Abandon propre : une alerte, une trace, et aucune réponse inventée. Se rappeler soi-même relancerait les essais sans fin.\",\"en\":\"Clean give-up: an alert, a trace, and no invented answer. Calling itself again would restart the retries endlessly.\"}}]},\"takeaway\":{\"fr\":\"La clé vit dans l’environnement, le plafond passe avant l’appel, les essais sont trois au plus avec un délai qui double.\",\"en\":\"The key lives in the environment, the cap comes before the call, attempts are three at most with a doubling delay.\"},\"more\":{\"fr\":\"Ce qui change d’une machine à l’autre (modèle, max_tours, budget_jour_eur, essais_max, adresse d’alerte) vit dans un fichier de configuration JSON. Jamais la clé.\\nFige aussi l’environnement : python -m venv, puis activate, puis installe des versions précises, pour que l’installation soit reproductible.\",\"en\":\"What changes from one machine to another (model, max_tours, budget_jour_eur, essais_max, alert address) lives in a JSON config file. Never the key.\\nAlso freeze the environment: python -m venv, then activate, then install pinned versions, so the setup is reproducible.\"}},{\"id\":\"errors\",\"prop\":\"c13_meter\",\"at\":{\"x\":250,\"y\":560},\"object\":{\"fr\":\"Le compteur de débit\",\"en\":\"The rate meter\"},\"title\":{\"fr\":\"Chaque code a sa réponse\",\"en\":\"Each code has its answer\"},\"show\":{\"fr\":\"L’API répond parfois par une erreur. Certaines sont passagères et se réessaient ; d’autres ne guériront pas en réessayant.\",\"en\":\"The API sometimes answers with an error. Some are temporary and can be retried; others will not heal by retrying.\"},\"mechanic\":{\"kind\":\"match\",\"prompt\":{\"fr\":\"Relie chaque erreur de l’API Claude à la bonne réaction.\",\"en\":\"Link each Claude API error to the right reaction.\"},\"pairs\":[{\"id\":\"429\",\"left\":{\"fr\":\"429 rate_limit_error\",\"en\":\"429 rate_limit_error\"},\"right\":{\"fr\":\"Limite de débit atteinte : attendre (en-tête retry-after), puis réessayer\",\"en\":\"Rate limit hit: wait (retry-after header), then retry\"}},{\"id\":\"529\",\"left\":{\"fr\":\"529 overloaded_error\",\"en\":\"529 overloaded_error\"},\"right\":{\"fr\":\"API surchargée pour tous : réessayer, délai qui double\",\"en\":\"API overloaded for everyone: retry, doubling delay\"}},{\"id\":\"500\",\"left\":{\"fr\":\"500 api_error\",\"en\":\"500 api_error\"},\"right\":{\"fr\":\"Erreur interne passagère : réessayer un nombre limité de fois\",\"en\":\"Temporary internal error: retry a limited number of times\"}},{\"id\":\"401\",\"left\":{\"fr\":\"401 authentication_error\",\"en\":\"401 authentication_error\"},\"right\":{\"fr\":\"Clé absente ou fausse : s’arrêter, message clair, sans afficher la clé\",\"en\":\"Key missing or wrong: stop, clear message, without showing the key\"}},{\"id\":\"400\",\"left\":{\"fr\":\"400 invalid_request_error\",\"en\":\"400 invalid_request_error\"},\"right\":{\"fr\":\"Demande mal formée : corriger la demande, réessayer ne sert à rien\",\"en\":\"Malformed request: fix the request, retrying is pointless\"}}]},\"takeaway\":{\"fr\":\"429, 529 et 500 sont passagers : on réessaie, peu de fois, en allongeant le délai. 401 et 400 viennent de toi : réessayer ne change rien.\",\"en\":\"429, 529 and 500 are temporary: retry, a few times, with a growing delay. 401 and 400 come from you: retrying changes nothing.\"},\"more\":{\"fr\":\"Une limite de débit borne ce que ton organisation peut envoyer par minute : requêtes, tokens d’entrée, tokens de sortie. Le plafond de dépense, lui, borne ce qu’elle peut payer.\\nExpérience 2 du programme : fais renvoyer un 529 par un faux client, trois fois de suite. Note combien d’essais, quel délai, et ce que voit l’utilisateur.\",\"en\":\"A rate limit caps what your organisation can send per minute: requests, input tokens, output tokens. The spend limit caps what it can pay.\\nProgramme experiment 2: have a fake client return a 529 three times in a row. Note how many attempts, what delay, and what the user sees.\"}},{\"id\":\"tools\",\"prop\":\"c13_clock\",\"at\":{\"x\":1290,\"y\":470},\"object\":{\"fr\":\"L’horloge de garde\",\"en\":\"The night-shift clock\"},\"title\":{\"fr\":\"Le bon outil pour la tâche\",\"en\":\"The right tool for the task\"},\"show\":{\"fr\":\"Toute tâche répétitive n’a pas besoin d’un agent. Générer du texte, enchaîner des applications par des règles, ou rejouer des clics dans un vieil écran sont trois métiers différents.\",\"en\":\"Not every repetitive task needs an agent. Generating text, chaining apps with rules, or replaying clicks on an old screen are three different jobs.\"},\"mechanic\":{\"kind\":\"sort\",\"prompt\":{\"fr\":\"Range chaque tâche de Brume \u0026 Quai sous l’outil qui lui convient.\",\"en\":\"Sort each Brume \u0026 Quai task under the tool that suits it.\"},\"bins\":[{\"id\":\"gen\",\"label\":{\"fr\":\"Générer (IA générative)\",\"en\":\"Generate (generative AI)\"}},{\"id\":\"auto\",\"label\":{\"fr\":\"Automatiser (déclencheur + règles)\",\"en\":\"Automate (trigger + rules)\"}},{\"id\":\"rpa\",\"label\":{\"fr\":\"RPA (rejouer des clics)\",\"en\":\"RPA (replay clicks)\"}}],\"items\":[{\"id\":\"brief\",\"label\":{\"fr\":\"Rédiger le brief du jeudi à partir des notes\",\"en\":\"Write Thursday’s brief from the notes\"},\"bin\":\"gen\",\"why\":{\"fr\":\"Produire un texte nouveau à partir de sources : c’est le terrain du modèle.\",\"en\":\"Producing new text from sources: that is the model’s ground.\"}},{\"id\":\"summary\",\"label\":{\"fr\":\"Résumer chaque mail long d’un client\",\"en\":\"Summarise each long client email\"},\"bin\":\"gen\",\"why\":{\"fr\":\"Comprendre et reformuler un texte libre demande un modèle.\",\"en\":\"Understanding and rephrasing free text needs a model.\"}},{\"id\":\"reminder\",\"label\":{\"fr\":\"Envoyer un rappel la veille de chaque rendez-vous\",\"en\":\"Send a reminder the day before each meeting\"},\"bin\":\"auto\",\"why\":{\"fr\":\"Un déclencheur et une règle fixe : aucun besoin d’IA, et c’est plus fiable.\",\"en\":\"A trigger and a fixed rule: no AI needed, and more reliable.\"}},{\"id\":\"copy\",\"label\":{\"fr\":\"Chaque lundi, copier les nouveaux rendez-vous dans un tableau\",\"en\":\"Every Monday, copy new meetings into a spreadsheet\"},\"bin\":\"auto\",\"why\":{\"fr\":\"Deux applications reliées par leurs API, selon un horaire : une automatisation simple.\",\"en\":\"Two apps linked through their APIs, on a schedule: a simple automation.\"}},{\"id\":\"legacy\",\"label\":{\"fr\":\"Saisir les factures dans un vieux logiciel sans API\",\"en\":\"Enter invoices into an old app with no API\"},\"bin\":\"rpa\",\"why\":{\"fr\":\"Sans API, un robot logiciel imite les clics et la frappe dans l’interface.\",\"en\":\"Without an API, a software robot mimics clicks and typing in the interface.\"}},{\"id\":\"export\",\"label\":{\"fr\":\"Exporter chaque soir un rapport depuis un portail sans API\",\"en\":\"Export a report every evening from a portal with no API\"},\"bin\":\"rpa\",\"why\":{\"fr\":\"Un parcours d’écrans toujours identique, sans autre accès : le cas typique de la RPA.\",\"en\":\"An always-identical screen path, with no other access: the typical RPA case.\"}}]},\"takeaway\":{\"fr\":\"Générer quand il faut comprendre ou écrire ; automatiser quand une règle suffit ; RPA quand seul l’écran est accessible. Le plus simple qui marche est le meilleur.\",\"en\":\"Generate when you need to understand or write; automate when a rule is enough; RPA when only the screen is reachable. The simplest thing that works is best.\"},\"more\":{\"fr\":\"Les trois se combinent : une automatisation déclenche l’agent chaque matin, l’agent rédige le brief, et un envoi programmé le dépose. La RPA est fragile : un bouton déplacé dans l’écran suffit à la casser.\",\"en\":\"The three combine: an automation triggers the agent every morning, the agent writes the brief, and a scheduled send delivers it. RPA is fragile: a button moved on the screen is enough to break it.\"}},{\"id\":\"roadmap\",\"prop\":\"c13_plan\",\"at\":{\"x\":1075,\"y\":560},\"object\":{\"fr\":\"Le tableau de route\",\"en\":\"The roadmap board\"},\"title\":{\"fr\":\"Planifier une mise en service\",\"en\":\"Planning a go-live\"},\"show\":{\"fr\":\"Un premier projet IA se planifie comme un autre : une étape à la fois, un responsable, une date, et un critère qui dit quand s’arrêter.\",\"en\":\"A first AI project is planned like any other: one step at a time, an owner, a date, and a criterion that says when to stop.\"},\"mechanic\":{\"kind\":\"choice\",\"prompt\":{\"fr\":\"Quelle fiche de projet est prête ?\",\"en\":\"Which project card is ready?\"},\"scene\":{\"fr\":\"Inès veut que l’agent prépare ses rendez-vous pour toute l’agence. Trois fiches sont épinglées au tableau.\",\"en\":\"Inès wants the agent to prepare meetings for the whole agency. Three cards are pinned on the board.\"},\"options\":[{\"id\":\"vague\",\"label\":{\"fr\":\"« On branche l’agent pour tout le monde, et on verra. »\",\"en\":\"“We plug the agent in for everyone, and we’ll see.”\"},\"correct\":false,\"why\":{\"fr\":\"Ni étape, ni responsable, ni date, ni critère d’arrêt : personne ne saura si c’est un succès.\",\"en\":\"No step, no owner, no date, no stop criterion: nobody will know whether it worked.\"}},{\"id\":\"ready\",\"label\":{\"fr\":\"« Étape 1 : les briefs d’Inès seule, une semaine. Responsable : toi. Début : lundi. Arrêt et retour arrière si plus de 2 échecs sur 40 demandes, ou budget dépassé. »\",\"en\":\"“Step 1: Inès’s briefs only, one week. Owner: you. Start: Monday. Stop and roll back if more than 2 failures in 40 requests, or budget exceeded.”\"},\"correct\":true,\"why\":{\"fr\":\"Exact. Un périmètre réduit d’abord, un responsable nommé, une date, et un critère d’arrêt mesurable dans le relevé du service.\",\"en\":\"Right. A narrow scope first, a named owner, a date, and a stop criterion measurable in the service log.\"}},{\"id\":\"nostop\",\"label\":{\"fr\":\"« Toute l’agence dès lundi. Responsable : l’équipe. On arrêtera si ça se passe mal. »\",\"en\":\"“The whole agency from Monday. Owner: the team. We’ll stop if it goes badly.”\"},\"correct\":false,\"why\":{\"fr\":\"« L’équipe » n’est personne, et « mal » n’est pas mesurable. Et tout le monde d’un coup, c’est la plus grosse panne possible.\",\"en\":\"“The team” is nobody, and “badly” is not measurable. And everyone at once means the biggest possible outage.\"}}]},\"takeaway\":{\"fr\":\"Une feuille de route découpe le projet en étapes ; chacune a un responsable, une date et un critère d’arrêt chiffré. Le minimum du programme : une semaine en service, tests verts avant chaque mise à jour.\",\"en\":\"A roadmap cuts the project into steps; each has an owner, a date and a numeric stop criterion. The programme’s minimum: one week in service, tests green before every update.\"},\"video\":\"LCEmiRjPEtQ\"}],\"challenge\":{\"title\":{\"fr\":\"La ronde de nuit\",\"en\":\"The night round\"},\"brief\":{\"fr\":\"Trois épreuves avant le dernier étage : lire le relevé d’une nuit de service, publier sans tout casser, et réparer une clé qui fuit.\",\"en\":\"Three trials before the top floor: read the log of a night in service, ship without breaking everything, and fix a leaking key.\"},\"steps\":[{\"kind\":\"spot\",\"prompt\":{\"fr\":\"Relevé d’une nuit de service. Clique les trois lignes où le service a mal réagi.\",\"en\":\"Log of a night in service. Click the three lines where the service reacted badly.\"},\"code\":true,\"lines\":[{\"text\":{\"fr\":\"22:00 démarrage · clé : lue dans l’environnement\",\"en\":\"22:00 start · key: read from the environment\"},\"faulty\":false},{\"text\":{\"fr\":\"22:14 req-014 · 529 overloaded_error · essai 1/3, attente 1 s\",\"en\":\"22:14 req-014 · 529 overloaded_error · attempt 1/3, wait 1 s\"},\"faulty\":false},{\"text\":{\"fr\":\"22:14 req-014 · 529 overloaded_error · essai 2/3, attente 2 s\",\"en\":\"22:14 req-014 · 529 overloaded_error · attempt 2/3, wait 2 s\"},\"faulty\":false,\"why\":{\"fr\":\"Correct : passager, réessayé avec un délai qui double.\",\"en\":\"Correct: temporary, retried with a doubling delay.\"}},{\"text\":{\"fr\":\"22:14 req-014 · réponse reçue\",\"en\":\"22:14 req-014 · response received\"},\"faulty\":false},{\"text\":{\"fr\":\"23:40 req-031 · 401 authentication_error · essai 1/3, attente 1 s\",\"en\":\"23:40 req-031 · 401 authentication_error · attempt 1/3, wait 1 s\"},\"faulty\":true,\"why\":{\"fr\":\"Une clé fausse ne guérit pas en réessayant. Il fallait s’arrêter avec un message clair.\",\"en\":\"A wrong key does not heal by retrying. It should stop with a clear message.\"}},{\"text\":{\"fr\":\"23:41 erreur · clé sk-ant-api03-Xq7… refusée\",\"en\":\"23:41 error · key sk-ant-api03-Xq7… refused\"},\"faulty\":true,\"why\":{\"fr\":\"La clé ne sort nulle part, même en partie : ni message d’erreur, ni trace.\",\"en\":\"The key appears nowhere, not even partly: no error message, no trace.\"}},{\"text\":{\"fr\":\"02:05 req-052 · appel envoyé · dépense 5,04 € / budget 5 € · alerte : budget dépassé\",\"en\":\"02:05 req-052 · call sent · spend €5.04 / budget €5 · alert: budget exceeded\"},\"faulty\":true,\"why\":{\"fr\":\"Le plafond a été vérifié après l’appel : trop tard. Il doit passer avant, et refuser.\",\"en\":\"The cap was checked after the call: too late. It must come first, and refuse.\"}},{\"text\":{\"fr\":\"02:06 req-053 · refusée : budget du jour atteint · alerte envoyée\",\"en\":\"02:06 req-053 · refused: daily budget reached · alert sent\"},\"faulty\":false,\"why\":{\"fr\":\"Correct : refus avant l’appel, et une alerte.\",\"en\":\"Correct: refused before the call, with an alert.\"}}]},{\"kind\":\"order\",\"prompt\":{\"fr\":\"Remets dans l’ordre une mise à jour sûre du service.\",\"en\":\"Put a safe service update in order.\"},\"items\":[{\"id\":\"change\",\"label\":{\"fr\":\"Modifier l’agent sur ta machine\",\"en\":\"Change the agent on your machine\"}},{\"id\":\"tests\",\"label\":{\"fr\":\"Lancer les 35 tests et les attaques, d’une seule commande\",\"en\":\"Run the 35 tests and the attacks, in a single command\"}},{\"id\":\"gate\",\"label\":{\"fr\":\"Un test échoue : ne pas publier ; tous verts : continuer\",\"en\":\"A test fails: do not ship; all green: go on\"},\"hint\":{\"fr\":\"La décision de publier vient du résultat des tests.\",\"en\":\"The decision to ship comes from the test results.\"}},{\"id\":\"ship\",\"label\":{\"fr\":\"Mettre la version d’avant de côté, puis publier la nouvelle\",\"en\":\"Set the previous version aside, then ship the new one\"},\"hint\":{\"fr\":\"On garde de quoi revenir en arrière avant de remplacer quoi que ce soit.\",\"en\":\"Keep a way back before replacing anything.\"}},{\"id\":\"watch\",\"label\":{\"fr\":\"Une alerte tombe : revenir en arrière en une commande\",\"en\":\"An alert fires: roll back in one command\"}}]},{\"kind\":\"choice\",\"multiple\":true,\"prompt\":{\"fr\":\"Que fais-tu ? Coche tout ce qui est nécessaire.\",\"en\":\"What do you do? Tick everything that is needed.\"},\"scene\":{\"fr\":\"Tu as poussé une clé d’API dans un fichier suivi par git, puis tu l’as supprimée au commit suivant.\",\"en\":\"You pushed an API key in a file tracked by git, then deleted it in the next commit.\"},\"options\":[{\"id\":\"revoke\",\"label\":{\"fr\":\"Révoquer la clé et en créer une nouvelle\",\"en\":\"Revoke the key and create a new one\"},\"correct\":true,\"why\":{\"fr\":\"Une clé qui a fui est perdue : seule la révocation la rend inutilisable.\",\"en\":\"A leaked key is lost: only revoking it makes it unusable.\"}},{\"id\":\"env\",\"label\":{\"fr\":\"Sortir la clé du dépôt et la lire dans l’environnement au démarrage\",\"en\":\"Take the key out of the repo and read it from the environment at start-up\"},\"correct\":true,\"why\":{\"fr\":\"C’est la correction durable : « Clé : lue dans l’environnement. »\",\"en\":\"That is the lasting fix: “Clé : lue dans l’environnement.”\"}},{\"id\":\"nothing\",\"label\":{\"fr\":\"Rien : le fichier est supprimé\",\"en\":\"Nothing: the file is deleted\"},\"correct\":false,\"why\":{\"fr\":\"La clé reste dans l’historique git : n’importe qui avec le dépôt peut la retrouver.\",\"en\":\"The key stays in the git history: anyone with the repo can find it.\"}},{\"id\":\"retry\",\"label\":{\"fr\":\"Passer max_retries à 10 pour compenser\",\"en\":\"Set max_retries to 10 to compensate\"},\"correct\":false,\"why\":{\"fr\":\"Les essais ne protègent pas une clé : ils ne servent qu’aux erreurs passagères.\",\"en\":\"Retries do not protect a key: they are only for temporary errors.\"}}]}],\"reward\":{\"name\":{\"fr\":\"Le volant de la chaufferie\",\"en\":\"The boiler-room handwheel\"},\"prop\":\"c13_wheel\"}},\"videos\":[{\"id\":\"LCEmiRjPEtQ\",\"title\":\"Andrej Karpathy: Software Is Changing (Again)\",\"channel\":\"Y Combinator\",\"lang\":\"en\",\"note\":{\"fr\":\"Sur les produits à autonomie partielle : avancer par petites étapes, un humain qui vérifie vite.\",\"en\":\"On partial-autonomy products: move in small steps, with a human who verifies quickly.\"},\"programme\":false}],\"resources\":[{\"title\":\"Errors\",\"url\":\"https://platform.claude.com/docs/en/api/errors\",\"kind\":\"doc\",\"source\":\"Claude Docs\",\"lang\":\"en\",\"note\":{\"fr\":\"Les codes d’erreur de l’API, puis les reprises : que faire d’un 429, d’un 529, d’un 500.\",\"en\":\"The API error codes, then retries: what to do with a 429, a 529, a 500.\"},\"programme\":true},{\"title\":\"Rate limits\",\"url\":\"https://platform.claude.com/docs/en/api/rate-limits\",\"kind\":\"doc\",\"source\":\"Claude Docs\",\"lang\":\"en\",\"note\":{\"fr\":\"Les limites de débit, puis les plafonds de dépense de l’organisation.\",\"en\":\"Rate limits, then the organisation’s spend limits.\"},\"programme\":true},{\"title\":\"III. Config\",\"url\":\"https://12factor.net/config\",\"kind\":\"article\",\"source\":\"The Twelve-Factor App\",\"lang\":\"en\",\"note\":{\"fr\":\"Une seule page : pourquoi la configuration et les secrets vivent dans l’environnement, jamais dans le code.\",\"en\":\"A single page: why configuration and secrets live in the environment, never in the code.\"},\"programme\":true},{\"title\":\"venv — Creation of virtual environments\",\"url\":\"https://docs.python.org/3/library/venv.html\",\"kind\":\"doc\",\"source\":\"Python documentation\",\"lang\":\"en\",\"note\":{\"fr\":\"Repère python -m venv et activate : une installation reproductible.\",\"en\":\"Find python -m venv and activate: a reproducible setup.\"},\"programme\":true}]},\"title\":\"Mettre en service\",\"block\":\"Bloc 6 · Capstone\",\"ids\":\"$5:props:children:0:props:ids\"}]}]]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"char
