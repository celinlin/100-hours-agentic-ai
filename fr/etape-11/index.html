onclusion prudente\",\"en\":\"Analysing a table with AI: reproducible calculation, cautious conclusion\"}],\"stations\":[{\"id\":\"trace\",\"prop\":\"c11_ticker\",\"at\":{\"x\":250,\"y\":560},\"object\":{\"fr\":\"Le téléscripteur\",\"en\":\"The ticker\"},\"title\":{\"fr\":\"Du tour à la trace\",\"en\":\"From turn to trace\"},\"show\":{\"fr\":\"Un log note un événement isolé. Une trace relie tous les événements d’un même cas, sous un même identifiant.\",\"en\":\"A log records an isolated event. A trace links all the events of the same case, under a single identifier.\"},\"mechanic\":{\"kind\":\"order\",\"prompt\":{\"fr\":\"Remets les lignes d’une trace dans l’ordre.\",\"en\":\"Put the lines of a trace in order.\"},\"items\":[{\"id\":\"id\",\"label\":{\"fr\":\"Le cas reçoit un identifiant, au départ\",\"en\":\"The case is given an identifier, at the start\"}},{\"id\":\"model\",\"label\":{\"fr\":\"Chaque appel au modèle note tokens et durée\",\"en\":\"Each call to the model records tokens and duration\"},\"hint\":{\"fr\":\"Sans identifiant d’abord, les lignes ne se relient pas entre elles.\",\"en\":\"Without an identifier first, the lines cannot be linked together.\"}},{\"id\":\"tool\",\"label\":{\"fr\":\"Chaque outil note ses arguments et son résultat\",\"en\":\"Each tool records its arguments and its result\"},\"hint\":{\"fr\":\"L’outil est appelé parce que le modèle l’a demandé.\",\"en\":\"The tool is called because the model asked for it.\"}},{\"id\":\"brake\",\"label\":{\"fr\":\"Le frein note les accords et les refus\",\"en\":\"The brake records approvals and refusals\"},\"hint\":{\"fr\":\"L’accord porte sur une action déjà proposée.\",\"en\":\"Approval concerns an action already proposed.\"}},{\"id\":\"total\",\"label\":{\"fr\":\"À la fin, un total : tours, durée, coût\",\"en\":\"At the end, a total: turns, duration, cost\"},\"hint\":{\"fr\":\"Le total ne se calcule qu’une fois le cas terminé.\",\"en\":\"The total can only be computed once the case is over.\"}}]},\"takeaway\":{\"fr\":\"Chaque appel laisse une ligne JSON ; mises bout à bout, elles racontent le cas. Ce qu’on ne voit pas, on ne le corrige pas.\",\"en\":\"Every call leaves a JSON line; put end to end, they tell the story of the case. What you cannot see, you cannot fix.\"},\"more\":{\"fr\":\"Les trois signaux de l’observabilité (primer OpenTelemetry) : le log, une ligne datée ; la trace, le récit d’un cas ; la métrique, un nombre suivi dans le temps (durée, coût, taux d’échec).\\nUne ligne du programme : {\\\"cas\\\": 12, \\\"tour\\\": 3, \\\"evenement\\\": \\\"outil\\\", \\\"nom\\\": \\\"chercher\\\", \\\"duree_ms\\\": 840, \\\"tokens\\\": {\\\"entree\\\": 2310, \\\"sortie\\\": 95}}.\",\"en\":\"The three observability signals (OpenTelemetry primer): the log, a timestamped line; the trace, the story of a case; the metric, a number tracked over time (duration, cost, failure rate).\\nA line from the programme: {\\\"cas\\\": 12, \\\"tour\\\": 3, \\\"evenement\\\": \\\"outil\\\", \\\"nom\\\": \\\"chercher\\\", \\\"duree_ms\\\": 840, \\\"tokens\\\": {\\\"entree\\\": 2310, \\\"sortie\\\": 95}}.\"}},{\"id\":\"backwards\",\"prop\":\"c11_traceboard\",\"at\":{\"x\":520,\"y\":470},\"object\":{\"fr\":\"Le tableau des traces\",\"en\":\"The trace board\"},\"title\":{\"fr\":\"Lire la trace à l’envers\",\"en\":\"Read the trace backwards\"},\"show\":{\"fr\":\"Sans trace, tu devines pourquoi un cas échoue. Avec, tu pars de la dernière ligne et tu remontes jusqu’au tour où tout bascule.\",\"en\":\"Without a trace, you guess why a case fails. With one, you start from the last line and go back up to the turn where everything tips over.\"},\"mechanic\":{\"kind\":\"spot\",\"prompt\":{\"fr\":\"Cas 12 : le brief n’a pas de budget. Clique la ligne qui en est la cause.\",\"en\":\"Case 12: the brief has no budget. Click the line that caused it.\"},\"code\":true,\"lines\":[{\"text\":{\"fr\":\"{\\\"cas\\\": 12, \\\"tour\\\": 1, \\\"evenement\\\": \\\"modele\\\", \\\"duree_ms\\\": 1210}\",\"en\":\"{\\\"cas\\\": 12, \\\"tour\\\": 1, \\\"evenement\\\": \\\"modele\\\", \\\"duree_ms\\\": 1210}\"},\"faulty\":false,\"why\":{\"fr\":\"Un appel au modèle normal.\",\"en\":\"A normal model call.\"}},{\"text\":{\"fr\":\"{\\\"cas\\\": 12, \\\"tour\\\": 2, \\\"evenement\\\": \\\"outil\\\", \\\"nom\\\": \\\"chercher\\\", \\\"duree_ms\\\": 840}\",\"en\":\"{\\\"cas\\\": 12, \\\"tour\\\": 2, \\\"evenement\\\": \\\"outil\\\", \\\"nom\\\": \\\"chercher\\\", \\\"duree_ms\\\": 840}\"},\"faulty\":false,\"why\":{\"fr\":\"La recherche a abouti en 840 ms.\",\"en\":\"The search succeeded in 840 ms.\"}},{\"text\":{\"fr\":\"{\\\"cas\\\": 12, \\\"tour\\\": 3, \\\"evenement\\\": \\\"erreur\\\", \\\"nom\\\": \\\"lire_devis\\\", \\\"detail\\\": \\\"délai dépassé\\\"}\",\"en\":\"{\\\"cas\\\": 12, \\\"tour\\\": 3, \\\"evenement\\\": \\\"erreur\\\", \\\"nom\\\": \\\"lire_devis\\\", \\\"detail\\\": \\\"délai dépassé\\\"}\"},\"faulty\":true,\"why\":{\"fr\":\"C’est ici que tout bascule : l’outil qui devait fournir le budget n’a rien rendu. Une trace muette ne l’aurait jamais montré.\",\"en\":\"This is where everything tips over: the tool that should have provided the budget returned nothing. A silent trace would never have shown it.\"}},{\"text\":{\"fr\":\"{\\\"cas\\\": 12, \\\"tour\\\": 4, \\\"evenement\\\": \\\"modele\\\", \\\"duree_ms\\\": 990}\",\"en\":\"{\\\"cas\\\": 12, \\\"tour\\\": 4, \\\"evenement\\\": \\\"modele\\\", \\\"duree_ms\\\": 990}\"},\"faulty\":false,\"why\":{\"fr\":\"Le modèle continue avec ce qu’il a reçu : sans devis.\",\"en\":\"The model carries on with what it received: no quote.\"}},{\"text\":{\"fr\":\"{\\\"cas\\\": 12, \\\"tour\\\": 5, \\\"evenement\\\": \\\"final\\\", \\\"detail\\\": \\\"budget : à confirmer\\\"}\",\"en\":\"{\\\"cas\\\": 12, \\\"tour\\\": 5, \\\"evenement\\\": \\\"final\\\", \\\"detail\\\": \\\"budget : à confirmer\\\"}\"},\"faulty\":false,\"why\":{\"fr\":\"C’est le symptôme, pas la cause : on part d’ici pour remonter.\",\"en\":\"This is the symptom, not the cause: you start here and go back up.\"}}]},\"takeaway\":{\"fr\":\"Une trace se lit de l’erreur vers sa cause. Chaque erreur s’écrit avec son tour : « Erreur : tour 3, outil lire_devis, délai dépassé. »\",\"en\":\"A trace is read from the error to its cause. Every error is written with its turn: “Error: turn 3, tool lire_devis, timeout.”\"},\"more\":{\"fr\":\"Expériences 1 et 2 du programme : devine d’abord pourquoi le pire cas de l’étape 10 échoue, puis relance-le avec la trace activée. Le tour où tout bascule est-il celui que tu avais deviné ?\",\"en\":\"Programme experiments 1 and 2: first guess why the worst case from step 10 fails, then rerun it with tracing on. Is the turn where everything tips over the one you guessed?\"}},{\"id\":\"tracer\",\"prop\":\"c11_console\",\"at\":{\"x\":800,\"y\":690},\"object\":{\"fr\":\"La console de bord\",\"en\":\"The control desk\"},\"title\":{\"fr\":\"Un traceur qui ne perd rien\",\"en\":\"A tracer that loses nothing\"},\"show\":{\"fr\":\"Le code de référence enveloppe chaque appel : il mesure la durée, écrit l’erreur, puis la laisse remonter.\",\"en\":\"The reference code wraps every call: it measures the duration, writes the error, then lets it propagate.\"},\"mechanic\":{\"kind\":\"fill\",\"prompt\":{\"fr\":\"Complète le traceur du programme.\",\"en\":\"Complete the programme’s tracer.\"},\"code\":true,\"template\":{\"fr\":\"def ecrire(**ligne) -\u003e None:\\n    ligne[\\\"t\\\"] = round(time.time(), 3)\\n    TRACE.write(json.dumps(ligne, ensure_ascii=False) + \\\"\\\\n\\\")\\n    TRACE.{{0}}()  # la ligne part tout de suite\\n\\n@contextmanager\\ndef tracer(cas: str, tour: int, evenement: str, nom: str):\\n    debut = time.{{1}}()\\n    try:\\n        yield\\n    except Exception as e:\\n        ecrire(cas=cas, tour=tour, evenement=\\\"erreur\\\",\\n               nom=nom, detail=str(e)[{{2}}])\\n        {{3}}\",\"en\":\"def ecrire(**ligne) -\u003e None:\\n    ligne[\\\"t\\\"] = round(time.time(), 3)\\n    TRACE.write(json.dumps(ligne, ensure_ascii=False) + \\\"\\\\n\\\")\\n    TRACE.{{0}}()  # la ligne part tout de suite\\n\\n@contextmanager\\ndef tracer(cas: str, tour: int, evenement: str, nom: str):\\n    debut = time.{{1}}()\\n    try:\\n        yield\\n    except Exception as e:\\n        ecrire(cas=cas, tour=tour, evenement=\\\"erreur\\\",\\n               nom=nom, detail=str(e)[{{2}}])\\n        {{3}}\"},\"blanks\":[{\"options\":[\"flush\",\"close\",\"truncate\"],\"answer\":\"flush\",\"why\":{\"fr\":\"Sans flush, en cas de plantage, les dernières lignes restent en mémoire et sont perdues.\",\"en\":\"Without flush, if the program crashes, the last lines stay in memory and are lost.\"}},{\"options\":[\"perf_counter\",\"sleep\",\"localtime\"],\"answer\":\"perf_counter\",\"why\":{\"fr\":\"perf_counter() est l’horloge faite pour mesurer une durée ; la différence donne duree_ms.\",\"en\":\"perf_counter() is the clock made for measuring a duration; the difference gives duree_ms.\"}},{\"options\":[\":200\",\"200:\",\":\"],\"answer\":\":200\",\"why\":{\"fr\":\"Deux cents caractères au plus : jamais un document entier dans la trace.\",\"en\":\"Two hundred characters at most: never a whole document in the trace.\"}},{\"options\":[\"raise\",\"pass\",\"return\"],\"answer\":\"raise\",\"why\":{\"fr\":\"L’erreur est tracée, puis relancée : sinon le programme la cache.\",\"en\":\"The error is traced, then re-raised: otherwise the program hides it.\"}}]},\"takeaway\":{\"fr\":\"Une ligne écrite tout de suite, une durée mesurée, une erreur tracée puis relancée, un détail coupé. Le bloc finally écrit la durée dans tous les cas.\",\"en\":\"A line written straight away, a measured duration, an error traced then re-raised, a truncated detail. The finally block writes the duration in every case.\"},\"more\":{\"fr\":\"Chaque ligne part en JSON dans traces.jsonl, une par événement : modele (tokens et durée), outil (nom, arguments masqués, durée), accord (oui ou non), total (tours, durée, coût). Masque avant d’écrire : ni clé, ni adresse complète.\",\"en\":\"Each line goes as JSON into traces.jsonl, one per event: modele (tokens and duration), outil (name, redacted arguments, duration), accord (yes or no), total (turns, duration, cost). Redact before writing: no key, no full address.\"}},{\"id\":\"cost\",\"prop\":\"c11_meter\",\"at\":{\"x\":1075,\"y\":560},\"object\":{\"fr\":\"Le compteur de coût\",\"en\":\"The cost meter\"},\"title\":{\"fr\":\"Des tokens aux euros\",\"en\":\"From tokens to euros\"},\"show\":{\"fr\":\"Le coût d’un cas, c’est ses tokens fois leur prix. L’entrée et la sortie n’ont pas le même prix par million de tokens.\",\"en\":\"The cost of a case is its tokens times their price. Input and output do not have the same price per million tokens.\"},\"mechanic\":{\"kind\":\"choice\",\"prompt\":{\"fr\":\"Combien coûte un brief, puis cent ?\",\"en\":\"How much does one brief cost, then a hundred?\"},\"scene\":{\"fr\":\"Cas 12, six tours additionnés : 20 000 tokens en entrée, 1 000 en sortie. Prix illustratifs : 3 € par million en entrée, 15 € par million en sortie.\",\"en\":\"Case 12, six turns added up: 20 000 input tokens, 1 000 output tokens. Illustrative prices: 3 € per million for input, 15 € per million for output.\"},\"options\":[{\"id\":\"ok\",\"label\":{\"fr\":\"0,075 € par brief, 7,50 € les cent\",\"en\":\"0.075 € per brief, 7.50 € per hundred\"},\"correct\":true,\"why\":{\"fr\":\"20 000 × 3 / 1 000 000 = 0,06 € ; 1 000 × 15 / 1 000 000 = 0,015 €. Total 0,075 €, fois cent.\",\"en\":\"20 000 × 3 / 1 000 000 = 0.06 €; 1 000 × 15 / 1 000 000 = 0.015 €. Total 0.075 €, times a hundred.\"}},{\"id\":\"flat\",\"label\":{\"fr\":\"0,063 € par brief, 6,30 € les cent\",\"en\":\"0.063 € per brief, 6.30 € per hundred\"},\"correct\":false,\"why\":{\"fr\":\"Tu as appliqué le prix d’entrée aux 21 000 tokens : la sortie coûte plus cher.\",\"en\":\"You applied the input price to all 21 000 tokens: output costs more.\"}},{\"id\":\"swap\",\"label\":{\"fr\":\"0,303 € par brief, 30,30 € les cent\",\"en\":\"0.303 € per brief, 30.30 € per hundred\"},\"correct\":false,\"why\":{\"fr\":\"Les prix sont inversés : les 20 000 tokens d’entrée ont été comptés au prix de sortie.\",\"en\":\"The prices are swapped: the 20 000 input tokens were counted at the output price.\"}},{\"id\":\"million\",\"label\":{\"fr\":\"75 € par brief\",\"en\":\"75 € per brief\"},\"correct\":false,\"why\":{\"fr\":\"Le prix est par million de tokens : il faut diviser par 1 000 000, pas par 1 000.\",\"en\":\"The price is per million tokens: divide by 1 000 000, not by 1 000.\"}}]},\"takeaway\":{\"fr\":\"Connais le coût d’un brief, puis de cent : c’est le chiffre qui dit si l’agent est sobre. L’entrée, relue à chaque tour, pèse souvent le plus lourd.\",\"en\":\"Know the cost of one brief, then of a hundred: that figure tells you whether the agent is frugal. Input, reread at every turn, often weighs the most.\"},\"more\":{\"fr\":\"Les prix réels sont sur la page Pricing de la documentation Claude (ressource du programme), en dollars par million de tokens, et changent selon le modèle. Sobriété : le brief le moins coûteux qui passe ta suite de tests, sans tours ni contexte inutiles.\",\"en\":\"Real prices are on the Pricing page of the Claude documentation (a programme resource), in dollars per million tokens, and vary by model. Sobriety: the cheapest brief that passes your test suite, with no needless turns or context.\"}},{\"id\":\"gauges\",\"prop\":\"c11_gauges\",\"at\":{\"x\":1290,\"y\":470},\"object\":{\"fr\":\"Le panneau des cadrans\",\"en\":\"The dial panel\"},\"title\":{\"fr\":\"Quatre cadrans à surveiller\",\"en\":\"Four dials to watch\"},\"show\":{\"fr\":\"Un agent utile fait gagner du temps, reste juste, coûte peu, et sert vraiment. Chaque cadran a ses chiffres.\",\"en\":\"A useful agent saves time, stays correct, costs little, and is actually used. Each dial has its figures.\"},\"mechanic\":{\"kind\":\"sort\",\"prompt\":{\"fr\":\"Range chaque indicateur sous son cadran.\",\"en\":\"Sort each indicator under its dial.\"},\"bins\":[{\"id\":\"time\",\"label\":{\"fr\":\"Temps\",\"en\":\"Time\"}},{\"id\":\"quality\",\"label\":{\"fr\":\"Qualité\",\"en\":\"Quality\"}},{\"id\":\"cost\",\"label\":{\"fr\":\"Coût\",\"en\":\"Cost\"}},{\"id\":\"adoption\",\"label\":{\"fr\":\"Adoption\",\"en\":\"Adoption\"}}],\"items\":[{\"id\":\"saved\",\"label\":{\"fr\":\"Temps gagné par brief, relecture comprise\",\"en\":\"Time saved per brief, review included\"},\"bin\":\"time\",\"why\":{\"fr\":\"Le temps gagné se compte relecture comprise, sinon on le surestime.\",\"en\":\"Time saved is counted with the review included, otherwise you overestimate it.\"}},{\"id\":\"latency\",\"label\":{\"fr\":\"Durée médiane d’un cas dans les traces\",\"en\":\"Median duration of a case in the traces\"},\"bin\":\"time\",\"why\":{\"fr\":\"La latence, lue dans les durées de la trace.\",\"en\":\"Latency, read from the durations in the trace.\"}},{\"id\":\"score\",\"label\":{\"fr\":\"Score 2,6 / 3 sur 29 cas\",\"en\":\"Score 2.6 / 3 over 29 cases\"},\"bin\":\"quality\",\"why\":{\"fr\":\"Le score de l’éval de l’étape 10.\",\"en\":\"The eval score from step 10.\"}},{\"id\":\"fails\",\"label\":{\"fr\":\"Cas en échec : 2 sur 29\",\"en\":\"Failing cases: 2 out of 29\"},\"bin\":\"quality\",\"why\":{\"fr\":\"Un taux d’échec, rapporté au bon dénominateur.\",\"en\":\"A failure rate, over the right denominator.\"}},{\"id\":\"eur\",\"label\":{\"fr\":\"Coût par brief : 0,04 €\",\"en\":\"Cost per brief: 0.04 €\"},\"bin\":\"cost\",\"why\":{\"fr\":\"Le total de la trace, converti en euros.\",\"en\":\"The trace total, converted into euros.\"}},{\"id\":\"cache\",\"label\":{\"fr\":\"Tokens facturés, avant et après le cache\",\"en\":\"Billed tokens, before and after caching\"},\"bin\":\"cost\",\"why\":{\"fr\":\"Ce que le cache change à la facture.\",\"en\":\"What caching changes on the bill.\"}},{\"id\":\"users\",\"label\":{\"fr\":\"Personnes de l’équipe qui lancent l’agent chaque semaine\",\"en\":\"Team members who run the agent each week\"},\"bin\":\"adoption\",\"why\":{\"fr\":\"Un agent parfait que personne n’utilise ne fait rien gagner.\",\"en\":\"A perfect agent that nobody uses saves nothing.\"}},{\"id\":\"used\",\"label\":{\"fr\":\"Briefs réellement utilisés en rendez-vous\",\"en\":\"Briefs actually used in meetings\"},\"bin\":\"adoption\",\"why\":{\"fr\":\"Produit ne veut pas dire utilisé.\",\"en\":\"Produced does not mean used.\"}}]},\"takeaway\":{\"fr\":\"Temps, qualité, coût, adoption : un seul cadran ne suffit pas. Moins cher ne veut pas dire meilleur, plus rapide non plus.\",\"en\":\"Time, quality, cost, adoption: one dial is not enough. Cheaper does not mean better, and neither does faster.\"}}],\"challenge\":{\"title\":{\"fr\":\"Le quart de nuit\",\"en\":\"The night watch\"},\"brief\":{\"fr\":\"Trois épreuves pour ouvrir la porte : un cache qui ne sert pas, un tableau à lire avec prudence, une trace à remonter.\",\"en\":\"Three trials to open the door: a cache that does not help, a table to read cautiously, a trace to follow back.\"},\"steps\":[{\"kind\":\"choice\",\"prompt\":{\"fr\":\"Pourquoi la facture d’entrée ne baisse-t-elle pas ?\",\"en\":\"Why does the input bill not go down?\"},\"scene\":{\"fr\":\"Chaque appel commence par « Date et heure : 14:03:27 », puis 2 000 tokens de consigne fixe, puis la demande. Le cache est activé ; dix cas relancés.\",\"en\":\"Every call starts with “Date and time: 14:03:27”, then 2 000 tokens of fixed instructions, then the request. Caching is on; ten cases rerun.\"},\"options\":[{\"id\":\"prefix\",\"label\":{\"fr\":\"La première ligne change à chaque appel : le début du contexte n’est jamais identique.\",\"en\":\"The first line changes on every call: the start of the context is never identical.\"},\"correct\":true,\"why\":{\"fr\":\"Le cache réutilise un début de contexte identique. Place la consigne fixe en tête, et l’heure après.\",\"en\":\"The cache reuses an identical start of context. Put the fixed instructions first, and the time after.\"}},{\"id\":\"answers\",\"label\":{\"fr\":\"Le cache garde les réponses : des demandes différentes donnent des réponses différentes.\",\"en\":\"The cache keeps answers: different requests give different answers.\"},\"correct\":false,\"why\":{\"fr\":\"Le cache de prompt ne stocke pas de réponses : il réutilise le début du contexte envoyé.\",\"en\":\"Prompt caching does not store answers: it reuses the start of the context sent.\"}},{\"id\":\"output\",\"label\":{\"fr\":\"Le cache ne réduit que les tokens de sortie.\",\"en\":\"The cache only reduces output tokens.\"},\"correct\":false,\"why\":{\"fr\":\"C’est l’inverse : il porte sur l’entrée, le début du prompt répété.\",\"en\":\"The opposite: it applies to the input, the repeated start of the prompt.\"}},{\"id\":\"volume\",\"label\":{\"fr\":\"Le cache ne sert qu’au-delà de cent cas.\",\"en\":\"The cache only helps beyond a hundred cases.\"},\"correct\":false,\"why\":{\"fr\":\"Un début identique peut être relu en cache dès l’appel suivant, tant que le cache n’a pas expiré.\",\"en\":\"An identical start can be read from cache from the very next call, as long as the cache has not expired.\"}}]},{\"kind\":\"sort\",\"prompt\":{\"fr\":\"Une IA a analysé le relevé (coût par cas : 0,02 · 0,03 · 0,03 · 0,04 · 0,31 €). Range ses conclusions.\",\"en\":\"An AI analysed the record (cost per case: 0.02 · 0.03 · 0.03 · 0.04 · 0.31 €). Sort its conclusions.\"},\"bins\":[{\"id\":\"ok\",\"label\":{\"fr\":\"Prudente et vérifiable\",\"en\":\"Cautious and checkable\"}},{\"id\":\"no\",\"label\":{\"fr\":\"Abusive\",\"en\":\"Overreaching\"}}],\"items\":[{\"id\":\"calc\",\"label\":{\"fr\":\"Moyenne 0,086 €, médiane 0,03 € : calcul joint, relançable\",\"en\":\"Mean 0.086 €, median 0.03 €: calculation attached, rerunnable\"},\"bin\":\"ok\",\"why\":{\"fr\":\"Les deux chiffres sont justes, et le calcul fourni permet de les refaire.\",\"en\":\"Both figures are right, and the supplied calculation lets you redo them.\"}},{\"id\":\"outlier\",\"label\":{\"fr\":\"Un seul cas, à 0,31 €, tire la moyenne vers le haut\",\"en\":\"A single case, at 0.31 €, pulls the mean up\"},\"bin\":\"ok\",\"why\":{\"fr\":\"D’où l’écart entre moyenne et médiane : ce cas mérite sa trace.\",\"en\":\"Hence the gap between mean and median: that case deserves its trace.\"}},{\"id\":\"scope\",\"label\":{\"fr\":\"Sur ces cinq cas, un brief coûte en général 0,03 €\",\"en\":\"On these five cases, a brief usually costs 0.03 €\"},\"bin\":\"ok\",\"why\":{\"fr\":\"La conclusion dit son périmètre : cinq cas, pas tous.\",\"en\":\"The conclusion states its scope: five cases, not all.\"}},{\"id\":\"all\",\"label\":{\"fr\":\"L’agent coûte cher sur tous les cas\",\"en\":\"The agent is expensive on every case\"},\"bin\":\"no\",\"why\":{\"fr\":\"Quatre cas sur cinq coûtent 0,04 € ou moins : la moyenne trompe ici.\",\"en\":\"Four cases out of five cost 0.04 € or less: the mean misleads here.\"}},{\"id\":\"better\",\"label\":{\"fr\":\"Le cache a rendu l’agent meilleur\",\"en\":\"Caching made the agent better\"},\"bin\":\"no\",\"why\":{\"fr\":\"Le tableau parle de coût, pas de qualité : seul le score de l’éval le dirait.\",\"en\":\"The table is about cost, not quality: only the eval score could say so.\"}},{\"id\":\"time\",\"label\":{\"fr\":\"L’agent fait gagner 25 minutes par brief\",\"en\":\"The agent saves 25 minutes per brief\"},\"bin\":\"no\",\"why\":{\"fr\":\"Aucun temps « à la main » n’est mesuré dans ce tableau : le chiffre est inventé.\",\"en\":\"No “by hand” time is measured in this table: the figure is made up.\"}}]},{\"kind\":\"spot\",\"prompt\":{\"fr\":\"Cas 30 : réponse « rendez-vous annulé ». Clique la ligne d’où vient l’ordre, et celle qui n’aurait jamais dû être écrite.\",\"en\":\"Case 30: answer “meeting cancelled”. Click the line the order came from, and the one that should never have been written.\"},\"code\":true,\"lines\":[{\"text\":{\"fr\":\"{\\\"cas\\\": 30, \\\"tour\\\"
