":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L10\",null,{}]]}]}]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"div\",null,{\"className\":\"page page--room\",\"children\":[[\"$\",\"$L11\",null,{\"lang\":\"fr\",\"ids\":[\"01\",\"02\",\"03\",\"04\",\"05\",\"06\",\"07\",\"08\",\"09\",\"10\",\"11\",\"12\",\"13\",\"14\"],\"tone\":\"night\"}],[\"$\",\"main\",null,{\"id\":\"main\",\"children\":[\"$\",\"$L12\",null,{\"lang\":\"fr\",\"game\":{\"id\":\"09\",\"room\":{\"name\":{\"fr\":\"Les cuisines du chef\",\"en\":\"The chef’s kitchens\"},\"style\":{\"wall\":\"#2b4446\",\"wallDeep\":\"#203436\",\"floor\":\"#5f4330\",\"accent\":\"#8a5a2b\",\"motif\":\"grid\"}},\"skills\":[{\"fr\":\"Décrire le rôle du chef (orchestrateur) et de ses aidants\",\"en\":\"Describe the role of the lead (orchestrator) and its helpers\"},{\"fr\":\"Repérer ce qui se découpe en parts indépendantes, et ce qui ne se découpe pas\",\"en\":\"Spot what splits into independent parts, and what does not\"},{\"fr\":\"Écrire une mission complète : tâche, contexte, format du retour, limite\",\"en\":\"Write a complete mission: task, context, return format, limit\"},{\"fr\":\"Lancer deux aidants en parallèle avec asyncio.TaskGroup, et en mesurer le coût\",\"en\":\"Run two helpers in parallel with asyncio.TaskGroup, and measure the cost\"},{\"fr\":\"Vérifier les retours avant de répondre, et signaler un écart\",\"en\":\"Check the returns before answering, and flag a discrepancy\"}],\"notions\":[{\"fr\":\"Choisir une méthode à qualité définie : préparation, contrôle, temps de reprise ; qualité et coût\",\"en\":\"Choosing a method with a defined quality: preparation, control, rework time; quality and cost\"},{\"fr\":\"L’IA au-delà du chat : solutions candidates, recherche de solutions\",\"en\":\"AI beyond chat: candidate solutions, searching for solutions\"}],\"stations\":[{\"id\":\"roles\",\"prop\":\"c09_pass\",\"at\":{\"x\":800,\"y\":690},\"object\":{\"fr\":\"Le passe\",\"en\":\"The pass\"},\"title\":{\"fr\":\"Un chef, deux aidants\",\"en\":\"One lead, two helpers\"},\"show\":{\"fr\":\"Le chef découpe la tâche : chaque aidant fait sa part, dans son propre contexte. Rien ne sort de la cuisine sans passer par le chef.\",\"en\":\"The lead splits the task: each helper does its part, in its own context. Nothing leaves the kitchen without going through the lead.\"},\"mechanic\":{\"kind\":\"order\",\"prompt\":{\"fr\":\"Remets le service dans l’ordre.\",\"en\":\"Put the service in order.\"},\"items\":[{\"id\":\"split\",\"label\":{\"fr\":\"Le chef lit la demande et la coupe en deux parts\",\"en\":\"The lead reads the request and splits it into two parts\"}},{\"id\":\"research\",\"label\":{\"fr\":\"L’aidant recherche lit l’index et cite ses sources\",\"en\":\"The research helper reads the index and cites its sources\"},\"hint\":{\"fr\":\"On ne rédige rien avant d’avoir les notes.\",\"en\":\"Nothing is written before the notes exist.\"}},{\"id\":\"write\",\"label\":{\"fr\":\"L’aidant rédaction écrit le brief à partir des notes\",\"en\":\"The writing helper writes the brief from the notes\"},\"hint\":{\"fr\":\"La rédaction part des notes de la recherche.\",\"en\":\"The writing starts from the research notes.\"}},{\"id\":\"json\",\"label\":{\"fr\":\"Chaque aidant rend un retour court, en JSON\",\"en\":\"Each helper returns a short reply, in JSON\"}},{\"id\":\"check\",\"label\":{\"fr\":\"Le chef assemble, vérifie, puis répond\",\"en\":\"The lead assembles, checks, then answers\"},\"hint\":{\"fr\":\"La vérification vient en dernier, juste avant la réponse.\",\"en\":\"Checking comes last, just before the answer.\"}}]},\"takeaway\":{\"fr\":\"L’orchestrateur découpe, confie, puis assemble et vérifie. Un aidant ne voit que sa mission : il ignore le reste du dossier.\",\"en\":\"The orchestrator splits, delegates, then assembles and checks. A helper sees only its mission: it knows nothing of the rest of the file.\"},\"more\":{\"fr\":\"C’est le motif orchestrator-workers de Building effective agents (Anthropic) : l’orchestrateur décide des sous-tâches selon la demande, au lieu de suivre un chemin fixé d’avance.\",\"en\":\"This is the orchestrator-workers pattern in Building effective agents (Anthropic): the orchestrator decides the subtasks based on the request, instead of following a path fixed in advance.\"}},{\"id\":\"split\",\"prop\":\"c09_rail\",\"at\":{\"x\":250,\"y\":560},\"object\":{\"fr\":\"Le rail des bons\",\"en\":\"The ticket rail\"},\"title\":{\"fr\":\"Ce qui se découpe, et ce qui ne se découpe pas\",\"en\":\"What splits, and what does not\"},\"show\":{\"fr\":\"Le brief de jeudi demande le budget, le délai, un texte et une vérification. Délègue seulement ce qui se découpe proprement.\",\"en\":\"Thursday’s brief needs the budget, the deadline, a text and a check. Delegate only what splits cleanly.\"},\"mechanic\":{\"kind\":\"sort\",\"prompt\":{\"fr\":\"À qui va chaque bon ?\",\"en\":\"Who gets each ticket?\"},\"bins\":[{\"id\":\"helper\",\"label\":{\"fr\":\"Confié à un aidant\",\"en\":\"Given to a helper\"}},{\"id\":\"chef\",\"label\":{\"fr\":\"Gardé par le chef\",\"en\":\"Kept by the lead\"}},{\"id\":\"whole\",\"label\":{\"fr\":\"Ne se découpe pas\",\"en\":\"Does not split\"}}],\"items\":[{\"id\":\"budget\",\"label\":{\"fr\":\"Trouver le budget validé par Inès\",\"en\":\"Find the budget Inès approved\"},\"bin\":\"helper\",\"why\":{\"fr\":\"Une part indépendante, avec une source à citer : mission de l’aidant recherche.\",\"en\":\"An independent part, with a source to cite: a job for the research helper.\"}},{\"id\":\"delai\",\"label\":{\"fr\":\"Trouver le délai de livraison\",\"en\":\"Find the delivery deadline\"},\"bin\":\"helper\",\"why\":{\"fr\":\"Indépendant du budget : les deux recherches peuvent même tourner en parallèle.\",\"en\":\"Independent from the budget: both searches can even run in parallel.\"}},{\"id\":\"brief\",\"label\":{\"fr\":\"Écrire le brief à partir des notes\",\"en\":\"Write the brief from the notes\"},\"bin\":\"helper\",\"why\":{\"fr\":\"Mission de l’aidant rédaction, qui ne reçoit que les notes utiles.\",\"en\":\"A job for the writing helper, which only receives the useful notes.\"}},{\"id\":\"verify\",\"label\":{\"fr\":\"Vérifier format, source et cohérence des retours\",\"en\":\"Check the returns’ format, source and consistency\"},\"bin\":\"chef\",\"why\":{\"fr\":\"C’est le chef qui vérifie, avant de répondre.\",\"en\":\"The lead is the one who checks, before answering.\"}},{\"id\":\"send\",\"label\":{\"fr\":\"Demander l’envoi de l’e-mail à Inès\",\"en\":\"Request sending the email to Inès\"},\"bin\":\"chef\",\"why\":{\"fr\":\"Aucun aidant n’a envoyer_email : seul le chef le demande, et il passe par le frein de l’étape 08.\",\"en\":\"No helper has envoyer_email: only the lead requests it, and it goes through step 08’s brake.\"}},{\"id\":\"half\",\"label\":{\"fr\":\"Les deux moitiés d’une même phrase du brief\",\"en\":\"The two halves of one sentence of the brief\"},\"bin\":\"whole\",\"why\":{\"fr\":\"Pas deux moitiés d’une phrase : les parts dépendent l’une de l’autre, les découper ajoute des erreurs.\",\"en\":\"Not two halves of a sentence: the parts depend on each other, splitting them adds errors.\"}}]},\"takeaway\":{\"fr\":\"Se découpent bien des parts indépendantes : chercher le budget, chercher le délai. La vérification et l’envoi restent au chef.\",\"en\":\"Independent parts split well: find the budget, find the deadline. Checking and sending stay with the lead.\"}},{\"id\":\"methods\",\"prop\":\"c09_slate\",\"at\":{\"x\":520,\"y\":470},\"object\":{\"fr\":\"L’ardoise des méthodes\",\"en\":\"The methods slate\"},\"title\":{\"fr\":\"Chaque méthode a un prix\",\"en\":\"Every method has a price\"},\"show\":{\"fr\":\"Préparer une mission, contrôler un retour, reprendre un travail mal fait : tout se paie en temps et en appels. Choisis la méthode selon la qualité attendue.\",\"en\":\"Preparing a mission, checking a return, redoing poor work: it all costs time and calls. Choose the method for the quality you expect.\"},\"mechanic\":{\"kind\":\"match\",\"prompt\":{\"fr\":\"Relie chaque méthode à ce qu’elle coûte ou rapporte.\",\"en\":\"Connect each method to what it costs or brings.\"},\"pairs\":[{\"id\":\"solo\",\"left\":{\"fr\":\"Un agent seul fait tout\",\"en\":\"One agent does everything\"},\"right\":{\"fr\":\"Un seul contexte qui s’allonge : des détails s’oublient\",\"en\":\"A single context that keeps growing: details get forgotten\"}},{\"id\":\"vague\",\"left\":{\"fr\":\"Une mission sans format ni limite\",\"en\":\"A mission with no format and no limit\"},\"right\":{\"fr\":\"Le chef doit deviner : du temps de reprise après coup\",\"en\":\"The lead has to guess: rework time afterwards\"}},{\"id\":\"seq\",\"left\":{\"fr\":\"Deux aidants l’un après l’autre\",\"en\":\"Two helpers one after the other\"},\"right\":{\"fr\":\"Des contextes courts, mais les durées s’additionnent\",\"en\":\"Short contexts, but the durations add up\"}},{\"id\":\"par\",\"left\":{\"fr\":\"Deux aidants en parallèle\",\"en\":\"Two helpers in parallel\"},\"right\":{\"fr\":\"Moins de temps, pas moins d’appels : le parallèle n’est pas gratuit\",\"en\":\"Less time, not fewer calls: parallel is not free\"}},{\"id\":\"explore\",\"left\":{\"fr\":\"Plusieurs aidants explorent chacun une piste\",\"en\":\"Several helpers each explore a lead\"},\"right\":{\"fr\":\"Des solutions candidates, que le chef compare avant d’en garder une\",\"en\":\"Candidate solutions, which the lead compares before keeping one\"}}]},\"takeaway\":{\"fr\":\"Plusieurs agents coûtent plusieurs fois le prix d’un agent seul. Ils se justifient quand la tâche se découpe et que la qualité gagnée vaut le coût.\",\"en\":\"Several agents cost several times the price of a single agent. They are worth it when the task splits and the quality gained is worth the cost.\"},\"more\":{\"fr\":\"D’après l’article Multi-agent research system (Anthropic), un agent consomme environ 4 fois plus de tokens qu’un chat, et un système multi-agents environ 15 fois plus. En échange, des aidants explorent plusieurs pistes en parallèle : l’IA ne répond plus seulement, elle cherche des solutions.\",\"en\":\"According to the Multi-agent research system article (Anthropic), an agent uses about 4× more tokens than a chat, and a multi-agent system about 15× more. In exchange, helpers explore several leads in parallel: the AI no longer just answers, it searches for solutions.\"},\"video\":\"sal78ACtGTc\"},{\"id\":\"parallel\",\"prop\":\"c09_stove\",\"at\":{\"x\":1075,\"y\":560},\"object\":{\"fr\":\"Le piano à deux feux\",\"en\":\"The two-burner range\"},\"title\":{\"fr\":\"Deux feux allumés en même temps\",\"en\":\"Two burners lit at once\"},\"show\":{\"fr\":\"Voici le code de référence du chef, avec quatre trous. Ce qui compte : chacun ses outils, la limite, le retour lisible et le lancement en parallèle.\",\"en\":\"Here is the lead’s reference code, with four gaps. What matters: each its own tools, the limit, a readable return and the parallel launch.\"},\"mechanic\":{\"kind\":\"fill\",\"prompt\":{\"fr\":\"Complète le code du chef.\",\"en\":\"Complete the lead’s code.\"},\"code\":true,\"template\":{\"fr\":\"import asyncio, json\\n\\nAIDANTS = {\\n    \\\"recherche\\\": [\\\"chercher\\\", \\\"calendrier\\\"],\\n    \\\"redaction\\\": {{0}},\\n}\\n\\nasync def aidant(nom: str, mission: str) -\u003e dict:\\n    texte = await lancer_agent(\\n        consigne=CONSIGNES[nom], demande=mission,\\n        outils=AIDANTS[nom], max_tours={{1}})\\n    try:\\n        return json.loads(texte)\\n    except {{2}}:\\n        return {\\\"erreur\\\": \\\"retour illisible\\\", \\\"aidant\\\": nom}\\n\\nasync def chef(demande: str) -\u003e list:\\n    async with asyncio.{{3}}() as groupe:\\n        r = groupe.create_task(aidant(\\\"recherche\\\", demande))\\n        b = groupe.create_task(aidant(\\\"redaction\\\", demande))\\n    return [r.result(), b.result()]  # puis vérifier, assembler\",\"en\":\"import asyncio, json\\n\\nAIDANTS = {\\n    \\\"recherche\\\": [\\\"chercher\\\", \\\"calendrier\\\"],\\n    \\\"redaction\\\": {{0}},\\n}\\n\\nasync def aidant(nom: str, mission: str) -\u003e dict:\\n    texte = await lancer_agent(\\n        consigne=CONSIGNES[nom], demande=mission,\\n        outils=AIDANTS[nom], max_tours={{1}})\\n    try:\\n        return json.loads(texte)\\n    except {{2}}:\\n        return {\\\"erreur\\\": \\\"retour illisible\\\", \\\"aidant\\\": nom}\\n\\nasync def chef(demande: str) -\u003e list:\\n    async with asyncio.{{3}}() as groupe:\\n        r = groupe.create_task(aidant(\\\"recherche\\\", demande))\\n        b = groupe.create_task(aidant(\\\"redaction\\\", demande))\\n    return [r.result(), b.result()]  # puis vérifier, assembler\"},\"blanks\":[{\"options\":[\"[]\",\"[\\\"envoyer_email\\\"]\",\"[\\\"chercher\\\", \\\"calendrier\\\", \\\"envoyer_email\\\"]\"],\"answer\":\"[]\",\"why\":{\"fr\":\"L’aidant rédaction écrit à partir des notes : aucun outil, et surtout aucun outil d’envoi. Seul le chef passe par le frein.\",\"en\":\"The writing helper writes from the notes: no tools, and above all no sending tool. Only the lead goes through the brake.\"}},{\"options\":[\"5\",\"None\",\"50\"],\"answer\":\"5\",\"why\":{\"fr\":\"Cinq tours au plus : un aidant ne tourne pas sans fin (casse 1).\",\"en\":\"Five turns at most: a helper does not loop forever (break 1).\"}},{\"options\":[\"json.JSONDecodeError\",\"asyncio.TimeoutError\",\"KeyError\"],\"answer\":\"json.JSONDecodeError\",\"why\":{\"fr\":\"C’est l’exception levée par json.loads sur un texte qui n’est pas du JSON valide. Un retour illisible ne casse rien : le chef reçoit une erreur claire.\",\"en\":\"That is the exception json.loads raises on text that is not valid JSON. An unreadable return breaks nothing: the lead gets a clear error.\"}},{\"options\":[\"TaskGroup\",\"Lock\",\"Queue\"],\"answer\":\"TaskGroup\",\"why\":{\"fr\":\"asyncio.TaskGroup (Python 3.11 et plus) lance les tâches ensemble ; à la sortie du bloc async with, toutes sont terminées. asyncio.gather fait le même travail.\",\"en\":\"asyncio.TaskGroup (Python 3.11 and later) runs the tasks together; when the async with block exits, all of them are done. asyncio.gather does the same job.\"}}]},\"takeaway\":{\"fr\":\"Chaque aidant a ses seuls outils, cinq tours au plus et un retour en JSON. Le TaskGroup les lance en même temps : la durée baisse, le nombre d’appels non.\",\"en\":\"Each helper has only its own tools, five turns at most and a JSON return. The TaskGroup launches them at once: the duration drops, the number of calls does not.\"},\"more\":{\"fr\":\"Expérience 3 : lance les deux aidants l’un après l’autre, puis en même temps, et mesure les deux durées. Note le temps gagné et le coût en appels.\",\"en\":\"Experiment 3: run both helpers one after the other, then at the same time, and measure both durations. Note the time saved and the cost in calls.\"}},{\"id\":\"conflict\",\"prop\":\"c09_rack\",\"at\":{\"x\":1290,\"y\":470},\"object\":{\"fr\":\"La cuillère de dégustation\",\"en\":\"The tasting spoon\"},\"title\":{\"fr\":\"Deux aidants se contredisent\",\"en\":\"Two helpers disagree\"},\"show\":{\"fr\":\"L’aidant recherche rend un budget de 15 000 € ; un autre retour dit 18 000 €. Le chef doit répondre.\",\"en\":\"The research helper returns a budget of €15,000; another return says €18,000. The lead has to answer.\"},\"mechanic\":{\"kind\":\"choice\",\"prompt\":{\"fr\":\"Que fait le chef ?\",\"en\":\"What does the lead do?\"},\"options\":[{\"id\":\"a\",\"label\":{\"fr\":\"Il garde 18 000 €, le retour arrivé en dernier.\",\"en\":\"It keeps €18,000, the return that arrived last.\"},\"correct\":false,\"why\":{\"fr\":\"L’ordre d’arrivée ne dit rien de la vérité : en parallèle, il dépend du hasard. C’est trancher en silence.\",\"en\":\"Arrival order says nothing about truth: in parallel, it depends on chance. That is deciding silently.\"}},{\"id\":\"b\",\"label\":{\"fr\":\"Il fait la moyenne : 16 500 €.\",\"en\":\"It takes the average: €16,500.\"},\"correct\":false,\"why\":{\"fr\":\"Ce chiffre n’existe dans aucune source : le chef invente.\",\"en\":\"This figure exists in no source: the lead is inventing.\"}},{\"id\":\"c\",\"label\":{\"fr\":\"Il signale l’écart avec les deux sources : « Écart : 15 000 € ici, 18 000 € là. »\",\"en\":\"It flags the gap with both sources: “Gap: €15,000 here, €18,000 there.”\"},\"correct\":true,\"why\":{\"fr\":\"Un écart se signale, il ne se tranche pas. Exiger une source par retour permet de remonter à l’origine.\",\"en\":\"A gap is flagged, not settled. Requiring a source per return lets you trace it back.\"}},{\"id\":\"d\",\"label\":{\"fr\":\"Il lance un troisième aidant et garde la majorité.\",\"en\":\"It launches a third helper and keeps the majority.\"},\"correct\":false,\"why\":{\"fr\":\"Plusieurs agents peuvent se tromper ensemble, et chaque aidant de plus coûte des appels. Le vote ne remplace pas la source.\",\"en\":\"Several agents can be wrong together, and each extra helper costs calls. A vote does not replace the source.\"}}]},\"takeaway\":{\"fr\":\"Le chef vérifie format, source et cohérence avant de répondre. Face à deux retours contradictoires, il signale l’écart au lieu de choisir en silence.\",\"en\":\"The lead checks format, source and consistency before answering. Faced with two contradictory returns, it flags the gap instead of choosing silently.\"}}],\"challenge\":{\"title\":{\"fr\":\"Le coup de feu\",\"en\":\"The rush\"},\"brief\":{\"fr\":\"Trois épreuves pour ouvrir la porte : corriger une mission, mener le service en chef, et savoir quand ne pas déléguer.\",\"en\":\"Three trials to open the door: fix a mission, run the service as the lead, and know when not to delegate.\"},\"steps\":[{\"kind\":\"spot\",\"prompt\":{\"fr\":\"Cette mission va mal tourner. Clique chaque ligne fautive.\",\"en\":\"This mission will go wrong. Click every faulty line.\"},\"code\":true,\"lines\":[{\"text\":{\"fr\":\"{\",\"en\":\"{\"},\"faulty\":false},{\"text\":{\"fr\":\"  \\\"aidant\\\": \\\"recherche\\\",\",\"en\":\"  \\\"aidant\\\": \\\"recherche\\\",\"},\"faulty\":false,\"why\":{\"fr\":\"Un aidant nommé, à mission unique : correct.\",\"en\":\"A named helper with a single mission: correct.\"}},{\"text\":{\"fr\":\"  \\\"tache\\\": \\\"occupe-toi de la recherche\\\",\",\"en\":\"  \\\"tache\\\": \\\"occupe-toi de la recherche\\\",\"},\"faulty\":true,\"why\":{\"fr\":\"Tâche floue (expérience 2) : chercher quoi ? Écris « trouver le budget validé par Inès ».\",\"en\":\"Vague task (experiment 2): search for what? Write “trouver le budget validé par Inès”.\"}},{\"text\":{\"fr\":\"  \\\"contexte\\\": [\\\"tous les dossiers\\\"],\",\"en\":\"  \\\"contexte\\\": [\\\"tous les dossiers\\\"],\"},\"faulty\":true,\"why\":{\"fr\":\"Le contexte doit être isolé : seulement ce qui sert la part, ici le dossier brume-et-quai.\",\"en\":\"The context must be isolated: only what serves the part, here the brume-et-quai folder.\"}},{\"text\":{\"fr\":\"  \\\"outils\\\": [\\\"chercher\\\", \\\"calendrier\\\", \\\"envoyer_email\\\"],\",\"en\":\"  \\\"outils\\\": [\\\"chercher\\\", \\\"calendrier\\\", \\\"envoyer_email\\\"],\"},\"faulty\":true,\"why\":{\"fr\":\"Aucun outil d’envoi chez un aidant : seul le chef le demande, à travers le frein.\",\"en\":\"No sending tool for a helper: only the lead requests it, through the brake.\"}},{\"text\":{\"fr\":\"  \\\"retour\\\": {\\\"reponse\\\": \\\"texte\\\", \\\"source\\\": \\\"fichier\\\"},\",\"en\":\"  \\\"retour\\\": {\\\"reponse\\\": \\\"texte\\\", \\\"source\\\": \\\"fichier\\\"},\"},\"faulty\":false,\"why\":{\"fr\":\"Un format de retour avec une source : le chef pourra vérifier.\",\"en\":\"A return format with a source: the lead will be able to check.\"}},{\"text\":{\"fr\":\"  \\\"limite\\\": null\",\"en\":\"  \\\"limite\\\": null\"},\"faulty\":true,\"why\":{\"fr\":\"Sans limite, l’aidant peut tourner sans fin (casse 1). Écris « 5 appels d’outils ».\",\"en\":\"Without a limit, the helper can loop forever (break 1). Write “5 appels d’outils”.\"}},{\"text\":{\"fr\":\"}\",\"en\":\"}\"},\"faulty\":false}]},{\"kind\":\"loop\",\"prompt\":{\"fr\":\"Tu joues le chef : délègue, vérifie, puis réponds.\",\"en\":\"You play the lead: delegate, check, then answer.\"},\"goal\":{\"fr\":\"Prépare le brief de jeudi avec Inès : budget validé, délai, puis un brief vérifié.\",\"en\":\"Prepare Thursday’s brief with Inès: approved budget, deadline, then a checked brief.\"},\"tools\":[{\"id\":\"research\",\"label\":\"aidant(\\\"recherche\\\", \\\"budget validé et délai\\\")\",\"returns\":{\"fr\":\"{\\\"reponse\\\": \\\"budget 15 000 €, livraison fin juin\\\", \\\"source\\\": \\\"devis-brume-et-quai.pdf\\\"} · 3 appels\",\"en\":\"{\\\"reponse\\\": \\\"budget 15 000 €, livraison fin juin\\\", \\\"source\\\": \\\"devis-brume-et-quai.pdf\\\"} · 3 calls\"}},{\"id\":\"solo\",\"label\":\"chercher(\\\"tout le dossier Brume \u0026 Quai\\\")\",\"returns\":{\"fr\":\"Quarante fichiers ajoutés au contexte du chef.\",\"en\":\"Forty files added to the lead’s context.\"}},{\"id\":\"write\",\"label\":\"aidant(\\\"redaction\\\", notes_recherche)\",\"returns\":{\"fr\":\"{\\\"reponse\\\": \\\"brief de douze lignes, budget 15 000 €, livraison fin juin\\\", \\\"source\\\": \\\"notes de recherche\\\"}\",\"en\":\"{\\\"reponse\\\": \\\"brief de douze lignes, budget 15 000 €, livraison fin juin\\\", \\\"source\\\": \\\"notes de recherche\\\"} (twelve-line brief)\"}},{\"id\":\"send\",\"label\":\"aidant(\\\"redaction\\\", \\\"envoie le brief à Inès\\\")\",\"returns\":{\"fr\":\"Refusé : la rédaction n’a pas d’outil d’envoi.\",\"en\":\"Refused: the writing helper has no sending tool.\"}},{\"id\":\"check\",\"label\":\"verifier(retours)\",\"returns\":{\"fr\":\"JSON valide, source citée, budget et délai identiques dans les notes et dans le brief.\",\"en\":\"Valid JSON, source cited, budget and deadline identical in the notes and the brief.\"}}],\"expected\":[\"research\",\"write\",\"check\"],\"wrongTool\":{\"fr\":\"Pas ce coup-ci. Chaque mission arrive à son tour : d’abord la recherche, puis la rédaction, puis ta vérification. Le chef ne refait pas tout seul, et aucun aidant n’envoie.\",\"en\":\"Not this move. Each mission comes in turn: research first, then writing, then your check. The lead does not redo everything alone, and no helper sends.\"},\"tooEarly\":{\"fr\":\"Trop tôt : le chef ne répond pas avant d’avoir assemblé et vérifié les retours.\",\"en\":\"Too early: the lead does not answer before assembling and checking the returns.\"},\"finalLabel\":{\"fr\":\"FINAL : répondre avec le brief vérifié\",\"en\":\"FINAL: answer with the checked brief\"}},{\"kind\":\"choice\",\"multiple\":true,\"prompt\":{\"fr\":\"Que conseilles-tu ? (plusieurs réponses)\",\"en\":\"What do you advise? (several answers)\"},\"scene\":{\"fr\":\"Tu veux reformuler en trois lignes l’objet de l’e-mail à Inès. Un collègue propose un chef et trois aidants.\",\"en\":\"You want to rephrase the subject of the email to Inès in three lines. A colleague suggests a lead and three helpers.\"},\"options\":[{\"id\":\"a\",\"label\":{\"fr\":\"Un seul agent : la tâche ne se découpe pas en parts indépendantes.\",\"en\":\"A single agent: the task does not split into independent parts.\"},\"correct\":true,\"why\":{\"fr\":\"Le plus souvent, un seul agent suffit. Si la tâche ne se découpe pas, ajouter des agents ajoute des erreurs et du coût.\",\"en\":\"Most of the time, one agent is enough. If the task does not split, adding agents adds errors and cost.\"}},{\"id\":\"b\",\"label\":{\"fr\":\"Fixer d’abord la qualité attendue, trois lignes, date et heure exactes, puis la contrôler.\",\"en\":\"First set the expected quality, three lines, exact date and time, then check it.\"},\"correct\":true,\"why\":{\"fr\":\"Une méthode se choisit pour une qualité définie : le critère dit quand c’est bon, et évite le temps de reprise.\",\"en\":\"A method is chosen for a defined quality: the criterion says when it is good, and avoids rework time.\"}},{\"id\":\"c\",\"label\":{\"fr\":\"Trois aidants en parallèle : ce sera trois fois plus rapide.\",\"en\":\"Three helpers in parallel: it will be three times faster.\"},\"correct\":false,\"why\":{\"fr\":\"Le parallèle n’est pas gratuit : trois fois les appels, et un chef qui doit tout réassembler pour trois lignes.\",\"en\":\"Parallel is not free: three times the calls, and a lead that must reassemble everything for three lines.\"}},{\"id\":\"d\",\"label\":{\"fr\":\"Deux aidants écrivent chacun une moitié de l’objet.\",\"en\":\"Two helpers each write half of the subject.\"},\"correct\":false,\"why\":{\"fr\":\"Pas deux moitiés d’une phrase : ces parts dépendent l’une de l’autre.\",\"en\":\"Not two halves of a sentence: these parts depend on each other.\"}}]}],\"reward\":{\"name\":{\"fr\":\"La toque du chef\",\"en\":\"The chef’s toque\"},\"prop\":\"c09_toque\"}},\"videos\":[{\"id\":\"sal78ACtGTc\",\"title\":\"What’s next for AI agentic workflows ft. Andrew Ng of AI Fund\",\"channel\":\"Sequoia Capital\",\"lang\":\"en\",\"note\":{\"fr\":\"Andrew Ng présente quatre motifs agentiques, dont la collaboration entre plusieurs agents.\",\"en\":\"Andrew Ng presents four agentic patterns, including collaboration between several agents.\"},\"programme\":false}],\"resources\":[{\"title\":\"How we built our multi-agent research system\",\"url\":\"https://www.anthropic.com/engineering/multi-agent-research-system\",\"kind\":\"article\",\"source\":\"Anthropic\",\"lang\":\"en\",\"note\":{\"fr\":\"L’architecture puis les principes : pourquoi des aidants en parallèle, et à quel prix en tokens.\",\"en\":\"The architecture then the principles: why helpers in parallel, and at what price in tokens.\"},\"programme\":true},{\"title\":\"Building effective agents\",\"url\":\"https://www.anthropic.com/engineering/building-effective-agents\",\"kin
